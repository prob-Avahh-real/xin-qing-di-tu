function switchTab(tabId) {
    // 闅愯棌鎵€鏈?section
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    
    // 鏄剧ず閫変腑鐨?section

    // 楂樹寒鎸夐挳
    event.currentTarget.classList.add('active');
}

// 鎾斁榫欓緳璁叉晠浜?function playStory() {

        console.error('鉂?鏁呬簨鍐呭涓虹┖鎴栧お鐭?);
        return;
    }
    
    // 浣跨敤娴忚鍣ㄨ闊冲悎鎴?    if ('speechSynthesis' in window) {
        // 鍋滄褰撳墠鎾斁
        window.speechSynthesis.cancel();
        
        const utterance = new SpeechSynthesisUtterance(storyText);
        
        // 璁剧疆榫欓緳鐨勫０闊筹紙鍙埍绔ュ０锛?        utterance.rate = 1.4;  // 绋嶅揩锛屽儚瀛╁瓙璇磋瘽
        utterance.pitch = 1.8; // 楂橀煶璋冿紝鍙埍
        utterance.volume = 1.0;
        utterance.lang = 'zh-CN';
        
        // 灏濊瘯鏌ユ壘涓枃濂冲０/绔ュ０
        try {
            const voices = speechSynthesis.getVoices();
            console.log('馃帳 鍙敤璇煶:', voices.length);
            
            if (voices.length > 0) {
                const zhVoice = voices.find(v => v.lang.includes('zh') || v.lang.includes('CN'));
                if (zhVoice) {
                    utterance.voice = zhVoice;
                    console.log('鉁?浣跨敤涓枃璇煶:', zhVoice.name);
                } else {
                    console.log('鈿狅笍 鏈壘鍒颁腑鏂囪闊筹紝浣跨敤榛樿璇煶');
                }

                console.log('鈿狅笍 璇煶鍒楄〃涓虹┖锛屾煇浜涙祻瑙堝櫒闇€瑕佺敤鎴蜂氦浜掑悗鎵嶈兘鍔犺浇璇煶');
            }
        } catch (e) {
            console.error('鉂?鑾峰彇璇煶鍒楄〃澶辫触:', e);
        }
        
        // 鎾斁鐘舵€?        utterance.onstart = () => {
            console.log('鉁?寮€濮嬫挱鏀?);
            showToast('馃攰 榫欓緳姝ｅ湪璁叉晠浜?..');
        };
        
        utterance.onend = () => {
            console.log('鉁?鎾斁瀹屾垚');
            showToast('鉁?鏁呬簨璁插畬鍟?);
        };
        
        utterance.onerror = (event) => {
            console.error('鉂?璇煶鎾斁澶辫触:', event);
            showToast('鉂?鎾斁澶辫触锛岃妫€鏌ラ煶閲?);
        };
        
        console.log('馃殌 寮€濮嬫挱鏀?..');
        window.speechSynthesis.speak(utterance);
        
        // 楠岃瘉鏄惁鐪熺殑寮€濮嬫挱鏀?        setTimeout(() => {
            if (window.speechSynthesis.speaking) {
                console.log('鉁?纭姝ｅ湪鎾斁');

                console.warn('鈿狅笍 鎾斁鍙兘鏈紑濮?);

}

// 鏄剧ず Toast
function showToast(message) {
    const toast = document.getElementById('toast');
    toast.textContent = message;
    toast.style.display = 'block';
    setTimeout(() => {
        toast.style.display = 'none';
    }, 3000);
}
