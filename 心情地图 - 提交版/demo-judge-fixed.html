function generateQRCode(){
    const url=window.location.href;
    const qrContainer=document.getElementById('qrcode');
    const statusEl=document.getElementById('qrStatus');
    document.getElementById('qrUrl').textContent=url;
    
    if(typeof QRCode==='undefined'){
        console.warn('QRCode 库未加载，使用备用方�?);
        showFallbackQR();
        return;
    }
    
    try{
        qrContainer.innerHTML='';
        new QRCode(qrContainer,{
            text:url,
            width:180,
            height:180,
            colorDark:'#667eea',
            colorLight:'#ffffff',
            correctLevel:QRCode.CorrectLevel.H
        });
        statusEl.className='qr-status success';

    document.getElementById('routeDisplay').innerHTML='<div class="route-card"><h3>🗺�?'+theme+'</h3><p style="color:#666;font-size:0.9rem;margin-bottom:10px;">'+match+'</p><div class="route-stats"><span class="route-stat">📍 '+pois.length+'个景�?/span><span class="route-stat">⏱️ '+totalTime.toFixed(1)+'小时</span><span class="route-stat">💰 �?+totalCost+'�?/span></div><div class="poi-list">'+pois.map((poi,idx)=>'<div class="poi-item"><h4>'+(idx+1)+'. '+poi.name+'</h4><p>💡 '+poi.why+'</p><p>🎫 '+poi.hook+' | ⏱️ '+poi.time+'分钟 | 💰 '+poi.cost+'�?/p><div class="tags">'+poi.tags.map(tag=>'<span class="tag">'+tag+'</span>').join('')+'</div></div>').join('')+'</div></div>';
    document.getElementById('routeBadge').style.display='inline-block';
}

function sendMessage(){
    const input=document.getElementById('chatInput');
    const message=input.value.trim();
    if(!message)return;
    addChatMessage('user',message);
    input.value='';
    const sendBtn=document.getElementById('sendBtn');
    sendBtn.innerHTML='<span class="loading"></span>';
    sendBtn.disabled=true;
    logAPI('request',`POST /api/agent/chat`,{message,character:'fulai'});
    setTimeout(()=>{const reply=generateAIReply(message);addChatMessage('assistant',reply);logAPI('response',`200 OK`,{reply:reply.substring(0,50)+'...'});sendBtn.innerHTML='发�?;sendBtn.disabled=false;},1500);
}

function addChatMessage(role,text){
    const chatBox=document.getElementById('chatBox');
    const messageDiv=document.createElement('div');
    messageDiv.className='chat-message '+role;
    messageDiv.innerHTML='<div class="chat-bubble">'+text+'</div>';
    chatBox.appendChild(messageDiv);
    chatBox.scrollTop=chatBox.scrollHeight;
}

    for(const keyword in responses){if(message.includes(keyword)){return responses[keyword];}}
    return responses['默认'];
}

function logAPI(type,endpoint,data){
    const logDiv=document.getElementById('apiLog');
    const timestamp=new Date().toLocaleTimeString();
    const logEntry=document.createElement('div');
    if(type==='request'){logEntry.className='request';logEntry.innerHTML='['+timestamp+'] 📤 '+endpoint+'<br><span style="color:#9cdcfe">'+JSON.stringify(data,null,2)+'</span>';}
    else{logEntry.className='response';logEntry.innerHTML='['+timestamp+'] 📥 '+endpoint+'<br><span style="color:#ce9178">'+JSON.stringify(data,null,2)+'</span>';}
    logDiv.appendChild(logEntry);
    logDiv.scrollTop=logDiv.scrollHeight;
}
