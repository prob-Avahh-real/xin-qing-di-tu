<!DOCTYPE html>

<head>

    <title>绂忔潵鐨勫績鎰挎竻鍗?/title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
        body{font-family:-apple-system,sans-serif;background:#f5f5f5;height:100vh;overflow:hidden;display:flex;flex-direction:column}
        
        /* 椤堕儴鐘舵€佹爮 */
        .status-bar{height:44px;background:linear-gradient(135deg,#F9B572,#E87A5D);color:white;display:flex;align-items:center;justify-content:center;font-size:1rem;font-weight:600;position:relative;flex-shrink:0}
        .status-bar .mascot{font-size:1.2rem;margin-right:8px}
        
        /* 椤甸潰瀹瑰櫒 - 鎵€鏈夐〉闈㈠彔鍦ㄤ竴璧?*/
        .pages-container{flex:1;position:relative;overflow:hidden}
        
        /* 鍗曚釜椤甸潰 */
        .page{position:absolute;top:0;left:0;width:100%;height:100%;overflow:hidden;background:#f5f5f5;display:none}
        .page.active{display:block}
        
        /* 椤甸潰鍐呭鍖?- 鍙粴鍔?*/

        /* 棣栭〉 */

        .points-card .number{font-size:2.5rem;font-weight:700;line-height:1}
        
        .countdown{background:linear-gradient(135deg,#1a1a2e,#2d1b4e);color:white;margin:12px 16px;padding:12px;border-radius:16px;text-align:center}
        .countdown .title{font-size:0.75rem;margin-bottom:8px;opacity:0.9}
        .countdown-timer{display:flex;justify-content:center;gap:12px}
        .countdown-item{text-align:center}
        .countdown-item .number{font-size:1.5rem;font-weight:700;color:#F9B572}
        .countdown-item .label{font-size:0.65rem;opacity:0.8}
        
        .progress{background:white;margin:12px 16px;padding:12px;border-radius:16px;box-shadow:0 2px 8px rgba(0,0,0,0.06)}
        .progress-header{display:flex;justify-content:space-between;margin-bottom:8px}
        .progress-header .title{font-size:0.8rem;color:#5a4a42;font-weight:600}
        .progress-header .current{font-size:0.8rem;color:#E87A5D;font-weight:700}
        .progress-bar{height:8px;background:#f0e6de;border-radius:4px;overflow:hidden}
        .progress-fill{height:100%;background:linear-gradient(90deg,#F9B572,#E87A5D);border-radius:4px;transition:width 0.5s}
        
        .section-title{font-size:0.85rem;font-weight:600;color:#5a4a42;padding:12px 16px 8px}
        
        /* 鍒嗙被鏍囩 */
        .tabs{display:flex;gap:8px;padding:0 16px 12px;overflow-x:auto;-webkit-overflow-scrolling:touch}
        .tab{background:white;border:1px solid #ffe0d0;padding:6px 14px;border-radius:16px;font-size:0.7rem;font-weight:600;color:#7a5a48;white-space:nowrap;flex-shrink:0}
        .tab.active{background:linear-gradient(135deg,#F9B572,#E87A5D);color:white;border-color:transparent}
        
        /* 濂栧姳缃戞牸 */
        .rewards{padding:0 16px 16px}
        .reward-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
        .reward-card{background:white;border-radius:12px;overflow-hidden;box-shadow:0 2px 8px rgba(0,0,0,0.06);cursor:pointer}
        .reward-card:active{transform:scale(0.98)}
        .reward-card .image{height:100px;background:linear-gradient(135deg,#fef3e4,#fee6d6);display:flex;align-items:center;justify-content:center;font-size:2.5rem;position:relative}
        .reward-card .badge{position:absolute;top:6px;right:6px;background:#F9B572;color:white;padding:2px 6px;border-radius:8px;font-size:0.6rem;font-weight:600}
        .reward-card .badge.hot{background:#ef4444}
        .reward-card .content{padding:10px}
        .reward-card .title{font-size:0.8rem;font-weight:600;color:#5a4a42;margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
        .reward-card .desc{font-size:0.65rem;color:#7a5a48;line-height:1.3;margin-bottom:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
        .reward-card .footer{display:flex;justify-content:space-between;align-items:center}
        .reward-card .points{color:#E87A5D;font-weight:700;font-size:0.8rem}
        .reward-card .btn{background:linear-gradient(135deg,#F9B572,#E87A5D);color:white;border:none;padding:4px 10px;border-radius:12px;font-size:0.65rem;font-weight:600}
        .reward-card .btn:disabled{background:#d1d5db}
        
        /* 浠诲姟鍒楄〃 */
        .tasks{padding:0 16px 16px}
        .task-item{background:white;border-radius:12px;padding:12px;margin-bottom:8px;display:flex;align-items:center;gap:12px}
        .task-item .icon{font-size:1.5rem}
        .task-item .info{flex:1;min-width:0}
        .task-item .title{font-size:0.8rem;font-weight:600;color:#5a4a42;margin-bottom:2px}
        .task-item .desc{font-size:0.65rem;color:#7a5a48;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
        .task-item .points{color:#E87A5D;font-weight:700;font-size:0.75rem;margin:0 8px}
        .task-item .btn{background:linear-gradient(135deg,#F9B572,#E87A5D);color:white;border:none;padding:6px 12px;border-radius:12px;font-size:0.65rem;font-weight:600;flex-shrink:0}
        .task-item .btn.completed{background:#10b981}
        
        /* 浠诲姟椤甸潰 */
        .task-header{background:linear-gradient(135deg,#F9B572,#E87A5D);color:white;padding:20px 16px;text-align:center}
        .task-header h2{font-size:1.2rem;margin-bottom:4px}
        .task-header p{font-size:0.75rem;opacity:0.9}
        
        /* 璁㈠崟椤甸潰 */
        .empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;height:60vh}
        .empty-state .icon{font-size:4rem;margin-bottom:16px;opacity:0.5}
        .empty-state .text{font-size:0.9rem;color:#999}
        
        /* 鎴戠殑椤甸潰 */
        .profile-header{background:linear-gradient(135deg,#F9B572,#E87A5D);color:white;padding:30px 16px;text-align:center}
        .profile-header .avatar{font-size:4rem;margin-bottom:12px;display:block}
        .profile-header .name{font-size:1.2rem;font-weight:600;margin-bottom:4px}
        .profile-header .desc{font-size:0.8rem;opacity:0.9}
        
        .menu-list{background:white;margin:12px 16px;border-radius:16px;overflow:hidden}
        .menu-item{padding:16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #f0f0f0;cursor:pointer}
        .menu-item:last-child{border-bottom:none}
        .menu-item:active{background:#f5f5f5}
        .menu-item .icon{font-size:1.5rem}
        .menu-item .title{flex:1;font-size:0.9rem;color:#333}
        .menu-item .arrow{color:#999}
        
        /* 搴曢儴瀵艰埅鏍?*/
        .tab-bar{height:60px;background:white;border-top:1px solid #e0e0e0;display:flex;justify-content:space-around;align-items:center;flex-shrink:0;padding-bottom:env(safe-area-inset-bottom)}
        .tab-item{flex:1;text-align:center;color:#999;font-size:0.7rem;transition:all 0.2s;cursor:pointer}
        .tab-item.active{color:#E87A5D}
        .tab-item .icon{font-size:1.5rem;display:block;margin-bottom:4px}
        
        /* 鎻愮ず妗?*/
        .toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.85);color:white;padding:12px 20px;border-radius:12px;font-size:0.8rem;z-index:1000;display:none}
        
        /* 椤甸潰鍒囨崲鍔ㄧ敾 */
        .page{transition:transform 0.3s ease-in-out}
        .page.entering{transform:translateX(100%);display:block}
        .page.entering.active{transform:translateX(0)}
        .page.leaving{transform:translateX(-100%)}
    </style>
</head>

<script>
// 鏁版嵁
let userPoints = parseInt(localStorage.getItem('pathjoy_merit_points')) || 470;
let userTasks = JSON.parse(localStorage.getItem('pathjoy_merit_tasks')) || [];

// 濂栧姳鏁版嵁
const REWARDS = [
    {id:1,title:'绂忔潵瀹堟姢鐚叕浠?,desc:'楂?20cm锛屾煍杞垝閫?,points:200,category:'cultural',image:'馃惐',badge:'hot'},
    {id:2,title:'榫欏崕濉旂绂忔墜涓?,desc:'寮€鍏夊姞鎸侊紝鐜涚憴鏉愯川',points:300,category:'cultural',image:'馃摽',badge:'hot'},
    {id:3,title:'绱犳枊鍒朵綔浣撻獙璇?,desc:'璺熸硶甯堝涔犵礌鏂嬬児楗?,points:500,category:'experience',image:'馃崥',badge:'new'},
    {id:4,title:'绂呬慨浣撻獙钀?,desc:'鍗婃棩绂呬慨锛屽啣鎯虫寚瀵?,points:800,category:'experience',image:'馃',badge:''},
    {id:5,title:'鐢靛瓙绁堢鐗?,desc:'鍙畾鍒剁绂忚锛屾案涔呬繚瀛?,points:99,category:'digital',image:'馃彯',badge:''},
    {id:6,title:'鏄庝俊鐗囧瑁?,desc:'12 寮犵簿缇庢槑淇＄墖',points:150,category:'cultural',image:'馃摦',badge:''},
    {id:7,title:'搴欎細绾康绔?,desc:'绾摐鏉愯川锛岄檺閲?1000 鏋?,points:250,category:'cultural',image:'馃弲',badge:'new'},
    {id:8,title:'鍔熷痉绠辨崘璧?,desc:'鏀寔鍙ゅ缓缁存姢',points:10,category:'merit',image:'馃檹',badge:''},
    {id:9,title:'绂忔潵鐩茬洅',desc:'闅忔満涓€娆撅紝鍏?6 娆?,points:180,category:'cultural',image:'馃巵',badge:'hot'},
    {id:10,title:'浜插瓙闈為仐璇?,desc:'瀛︿範浼犵粺鎵嬪伐鑹?,points:350,category:'experience',image:'馃懆鈥嶐煈┾€嶐煈?,badge:''}
];

// 浠诲姟鏁版嵁
const TASKS = [
    {id:1,title:'瀹屾垚鎯呮劅璺嚎鎵撳崱',desc:'瀹屾垚鍏ㄩ儴鏅偣鎵撳崱',points:100,icon:'馃椇锔?},
    {id:2,title:'鎷嶇収鎵撳崱鏅偣',desc:'鎷嶇収骞朵笂浼?,points:50,icon:'馃摳'},
    {id:3,title:'闃呰鐭ヨ瘑搴?,desc:'闃呰榫欏崕鏂囧寲鏂囩珷',points:30,icon:'馃摎'},
    {id:4,title:'浣撻獙璇煶瀵艰',desc:'鎾斁鏅偣璇煶璁茶В',points:40,icon:'馃幁'},
    {id:5,title:'鍙戠幇闅愯棌褰╄泲',desc:'鎵惧埌闅愯棌褰╄泲鏅偣',points:80,icon:'馃攳'},
    {id:6,title:'鍒嗕韩鍒版湅鍙嬪湀',desc:'鐢熸垚鍥剧墖骞跺垎浜?,points:60,icon:'馃摛'},
    {id:7,title:'鍙備笌鍏泭娲诲姩',desc:'鍙備笌绱犳枊/绁壂绛?,points:100,icon:'馃檹'},
    {id:8,title:'閭€璇峰ソ鍙?,desc:'閭€璇峰ソ鍙嬫敞鍐屼娇鐢?,points:150,icon:'馃懃'}
];

// 鍒囨崲椤甸潰
function switchPage(pageName, tabElement) {
    // 鏇存柊搴曢儴瀵艰埅
    document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
    tabElement.classList.add('active');
    
    // 鏇存柊椤堕儴鏍囬
    const titles = {
        'home': '绂忔潵鐨勫績鎰挎竻鍗?,
        'tasks': '璧氬姛寰蜂换鍔?,
        'orders': '鎴戠殑璁㈠崟',
        'profile': '涓汉涓績'
    };
    document.getElementById('pageTitle').textContent = titles[pageName];
    
    // 鍒囨崲椤甸潰
    document.querySelectorAll('.page').forEach(p => {
        p.classList.remove('active', 'entering', 'leaving');
    });
    
    const targetPage = document.getElementById('page-' + pageName);
    targetPage.classList.add('entering');
    setTimeout(() => {
        targetPage.classList.add('active');
        targetPage.classList.remove('entering');
    }, 300);
    
    // 婊氬姩鍒伴《閮?    targetPage.querySelector('.page-content').scrollTop = 0;
}

// 鍒濆鍖?function init() {
    updatePoints();
    renderRewards('all');
    renderTasks();
    setupTabs();
    startCountdown();
}

// 鏇存柊鍔熷痉鍊?function updatePoints() {
    document.getElementById('myPoints').textContent = userPoints;
    localStorage.setItem('pathjoy_merit_points', userPoints.toString());
    
    const progress = Math.min((userPoints / 1000) * 100, 100);
    document.getElementById('progressFill').style.width = progress + '%';
    document.getElementById('progressCurrent').textContent = userPoints + '/1000';
    
    // 鏇存柊浠诲姟鎸夐挳鐘舵€?    document.querySelectorAll('.task-btn').forEach(btn => {
        const taskId = parseInt(btn.getAttribute('data-task-id'));
        if (userTasks.includes(taskId)) {
            btn.classList.add('completed');
            btn.textContent = '鉁?;
            btn.disabled = true;
        }
    });
}

// 娓叉煋濂栧姳
function renderRewards(category) {
    const grid = document.getElementById('rewardGrid');
    const filtered = category === 'all' ? REWARDS : REWARDS.filter(r => r.category === category);
    
    grid.innerHTML = filtered.map(r => `
        <div class="reward-card" onclick="exchange(${r.id})">
            <div class="image">
                ${r.image}
                ${r.badge ? `<span class="badge ${r.badge}">${r.badge === 'hot' ? '鐑棬' : '鏂板搧'}</span>` : ''}
            </div>
            <div class="content">
                <div class="title">${r.title}</div>
                <div class="desc">${r.desc}</div>
                <div class="footer">
                    <span class="points">${r.points}鍔熷痉</span>
                    <button class="btn" ${userPoints < r.points ? 'disabled' : ''}>
                        ${userPoints < r.points ? '涓嶈冻' : '鍏戞崲'}
                    </button>
                </div>
            </div>
        </div>
    `).join('');
}

// 娓叉煋浠诲姟
function renderTasks() {
    const homeList = document.getElementById('homeTaskList');
    const taskList = document.getElementById('taskList');
    
    const html = TASKS.map(t => {
        const completed = userTasks.includes(t.id);
        return `
            <div class="task-item">
                <span class="icon">${t.icon}</span>
                <div class="info">
                    <div class="title">${t.title}</div>
                    <div class="desc">${t.desc}</div>
                </div>
                <span class="points">+${t.points}</span>
                <button class="btn ${completed ? 'completed' : ''}" 
                    data-task-id="${t.id}" 
                    onclick="completeTask(${t.id})" 
                    ${completed ? 'disabled' : ''}>
                    ${completed ? '鉁? : '鍘诲仛'}
                </button>
            </div>
        `;
    }).join('');
    
    if (homeList) homeList.innerHTML = html.slice(0, 3); // 棣栭〉鍙樉绀?3 涓?    if (taskList) taskList.innerHTML = html; // 浠诲姟椤垫樉绀哄叏閮?}

// 瀹屾垚浠诲姟
function completeTask(id) {
    const task = TASKS.find(t => t.id === id);
    userTasks.push(id);
    userPoints += task.points;
    localStorage.setItem('pathjoy_merit_tasks', JSON.stringify(userTasks));
    updatePoints();
    renderTasks();
    renderRewards(document.querySelector('.tab.active')?.dataset.category || 'all');
    showToast(`鉁?+${task.points}鍔熷痉`);
}

// 鍏戞崲濂栧姳
function exchange(id) {
    const reward = REWARDS.find(r => r.id === id);
    if (userPoints < reward.points) {
        showToast('鉂?鍔熷痉涓嶈冻');
        return;
    }
    
    if (confirm(`鍏戞崲銆?{reward.title}銆嶏紵\n娑堣€?{reward.points}鍔熷痉`)) {
        userPoints -= reward.points;
        updatePoints();
        renderRewards(document.querySelector('.tab.active')?.dataset.category || 'all');
        showToast('鉁?鍏戞崲鎴愬姛');
        
        const orders = JSON.parse(localStorage.getItem('pathjoy_orders') || '[]');
        orders.push({rewardId:reward.id,title:reward.title,points:reward.points,date:new Date().toISOString()});
        localStorage.setItem('pathjoy_orders', JSON.stringify(orders));
        
        // 鏇存柊璁㈠崟椤?        renderOrders();
    }
}

// 娓叉煋璁㈠崟
function renderOrders() {
    const orders = JSON.parse(localStorage.getItem('pathjoy_orders') || '[]');
    const ordersPage = document.getElementById('page-orders');
    
    if (orders.length === 0) {
        ordersPage.innerHTML = `
            <div class="page-content">
                <div class="empty-state">
                    <span class="icon">馃摝</span>
                    <span class="text">鏆傛棤璁㈠崟</span>
                </div>
            </div>
        `;
    } else {
        ordersPage.innerHTML = `
            <div class="page-content">
                <div style="padding:16px">
                    ${orders.map(o => `
                        <div style="background:white;border-radius:12px;padding:12px;margin-bottom:12px">
                            <div style="display:flex;justify-content:space-between;margin-bottom:8px">
                                <span style="font-size:0.8rem;font-weight:600;color:#333">${o.title}</span>
                                <span style="font-size:0.75rem;color:#999">${new Date(o.date).toLocaleDateString('zh-CN')}</span>
                            </div>
                            <div style="font-size:0.75rem;color:#E87A5D">-${o.points} 鍔熷痉</div>
                        </div>
                    `).join('')}
                </div>
            </div>
        `;
    }
}

// 鍒囨崲鍒嗙被
function setupTabs() {
    document.querySelectorAll('.tab').forEach(tab => {
        tab.addEventListener('click', function() {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            this.classList.add('active');
            renderRewards(this.dataset.category);
        });
    });
}

// 鍊掕鏃?function startCountdown() {
    const target = new Date('2026-05-01T00:00:00');
    function update() {
        const now = new Date();
        const diff = target - now;
        if (diff <= 0) {
            document.getElementById('countdownTimer').innerHTML = '<div style="font-size:1.2rem;color:#F9B572">馃帄 搴欎細宸插紑濮嬶紒</div>';
            return;
        }
        document.getElementById('days').textContent = Math.floor(diff/(1000*60*60*24));
        document.getElementById('hours').textContent = Math.floor((diff%(1000*60*60*24))/(1000*60*60));
        document.getElementById('minutes').textContent = Math.floor((diff%(1000*60*60))/(1000*60));
    }
    update();
    setInterval(update, 60000);
}

// 鎻愮ず妗?function showToast(msg) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.style.display = 'block';
    setTimeout(() => toast.style.display = 'none', 2000);
}

init();
</script>
</body>
