<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>测试高德地图API Key</title>
    <script src="https://webapi.amap.com/loader.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        #map {
            width: 100%;
            height: 400px;
            border: 1px solid #ccc;
            margin-top: 20px;
        }
        .status {
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
        }
        .success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .info {
            background-color: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
    </style>
</head>
<body>
    <h1>高德地图API Key测试</h1>
    
    <div class="status info">
        <p><strong>测试的Key:</strong> <code id="key-display">1b5043d007049b9da6db6f39ed05edd5</code></p>
        <p>当前域名: <span id="current-domain"></span></p>
    </div>
    
    <div id="status" class="status"></div>
    
    <div id="map"></div>
    
    <div class="status info">
        <h3>常见问题排查:</h3>
        <ol>
            <li>检查Key是否正确（控制台→应用管理→Key管理）</li>
            <li>检查Key类型是否为"Web端(JS API)"</li>
            <li>检查安全域名是否包含当前域名（localhost或127.0.0.1）</li>
            <li>检查Key是否启用</li>
            <li>检查网络连接（可能需要科学上网）</li>
        </ol>
    </div>

    <script>
        // 显示当前域名
        document.getElementById('current-domain').textContent = window.location.hostname;
        
        // 高德地图Key
        const amapKey = '1b5043d007049b9da6db6f39ed05edd5';
        
        // 测试加载高德地图
        AMapLoader.load({
            key: amapKey,
            version: '2.0',
            plugins: []
        }).then((AMap) => {
            document.getElementById('status').className = 'status success';
            document.getElementById('status').innerHTML = `
                <p><strong>✅ 高德地图加载成功!</strong></p>
                <p>API Key有效，可以正常使用。</p>
                <p>SDK版本: ${AMap.v}</p>
            `;
            
            // 创建地图
            const map = new AMap.Map('map', {
                zoom: 15,
                center: [116.397428, 39.90923]
            });
            
            // 添加标记
            const marker = new AMap.Marker({
                position: [116.397428, 39.90923],
                title: '测试点 - 天安门'
            });
            map.add(marker);
            
        }).catch((error) => {
            document.getElementById('status').className = 'status error';
            document.getElementById('status').innerHTML = `
                <p><strong>❌ 高德地图加载失败!</strong></p>
                <p>错误信息: ${error.message || error}</p>
                <p>可能的原因:</p>
                <ul>
                    <li>API Key无效或已过期</li>
                    <li>当前域名不在安全域名列表中</li>
                    <li>网络连接问题</li>
                    <li>高德地图服务暂时不可用</li>
                </ul>
                <p>请登录 <a href="https://lbs.amap.com/" target="_blank">高德开发者平台</a> 检查Key配置。</p>
            `;
            console.error('高德地图加载错误:', error);
        });
        
        // 检查环境变量
        console.log('测试页面加载完成');
        console.log('当前域名:', window.location.hostname);
        console.log('测试Key:', amapKey);
    </script>
</body>
</html>
