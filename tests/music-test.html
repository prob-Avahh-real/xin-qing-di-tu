<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎵 音乐测试 - 龙华·灵境向导</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:-apple-system,sans-serif;background:linear-gradient(180deg,#1a1a2e,#2d1b4e);color:white;min-height:100vh;padding:40px 20px}
        .container{max-width:900px;margin:0 auto}
        h1{font-size:2rem;margin-bottom:8px;text-align:center}
        .subtitle{text-align:center;opacity:0.8;margin-bottom:40px}
        .music-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;margin-bottom:40px}
        .music-card{background:rgba(255,255,255,0.1);border-radius:20px;padding:20px;cursor:pointer;transition:all 0.3s;border:2px solid transparent}
        .music-card:hover{background:rgba(255,255,255,0.15);transform:translateY(-4px)}
        .music-card.playing{border-color:#F9B572;background:rgba(249,181,114,0.2)}
        .music-card .icon{font-size:3rem;margin-bottom:12px}
        .music-card .emotion{font-weight:600;font-size:1.1rem;margin-bottom:4px}
        .music-card .name{opacity:0.8;font-size:0.9rem;margin-bottom:8px}
        .music-card .artist{opacity:0.6;font-size:0.75rem}
        .player-bar{position:fixed;bottom:0;left:0;width:100%;background:rgba(0,0,0,0.9);backdrop-filter:blur(10px);padding:20px;display:none}
        .player-bar.show{display:block}
        .player-content{max-width:900px;margin:0 auto;display:flex;align-items:center;gap:20px}
        .player-info{flex:1}
        .player-info .now-playing{font-size:0.85rem;opacity:0.6;margin-bottom:4px}
        .player-info .song-name{font-weight:600;font-size:1.1rem}
        .player-controls{display:flex;gap:12px}
        .player-btn{background:#F9B572;color:white;border:none;padding:12px 24px;border-radius:20px;font-weight:600;cursor:pointer;transition:all 0.2s}
        .player-btn:hover{background:#E87A5D;transform:scale(1.05)}
        .player-btn:active{transform:scale(0.95)}
        .volume-control{display:flex;align-items:center;gap:8px}
        .volume-slider{width:100px}
        .test-section{background:rgba(255,255,255,0.05);border-radius:20px;padding:24px;margin-bottom:40px}
        .test-section h2{font-size:1.3rem;margin-bottom:16px;display:flex;align-items:center;gap:8px}
        .test-btn{background:#10b981;color:white;border:none;padding:14px 28px;border-radius:20px;font-weight:600;cursor:pointer;font-size:1rem;margin-right:12px;margin-bottom:12px}
        .test-btn:hover{background:#059669}
        .test-result{background:rgba(0,0,0,0.3);border-radius:12px;padding:16px;margin-top:16px;font-family:monospace;font-size:0.85rem;white-space:pre-wrap;max-height:300px;overflow-y:auto}
        .status-badge{display:inline-block;padding:4px 12px;border-radius:20px;font-size:0.75rem;font-weight:600;margin-left:8px}
        .status-badge.success{background:#10b981;color:white}
        .status-badge.error{background:#ef4444;color:white}
        .status-badge.warning{background:#f59e0b;color:white}
    </style>
</head>
<body>
<div class="container">
    <h1>🎵 音乐播放器测试</h1>
    <p class="subtitle">使用 Pixabay 免费可商用音乐 | 所有音乐均可正常播放</p>
    
    <!-- 音乐选择 -->
    <div class="music-grid" id="musicGrid"></div>
    
    <!-- 测试区域 -->
    <div class="test-section">
        <h2>🔧 测试工具 <span class="status-badge warning">调试模式</span></h2>
        <button class="test-btn" onclick="testAllMusic()">🧪 测试所有音乐</button>
        <button class="test-btn" onclick="stopAll()">⏹️ 停止所有</button>
        <div class="test-result" id="testResult">等待测试...</div>
    </div>
</div>

<!-- 播放器控制条 -->
<div class="player-bar" id="playerBar">
    <div class="player-content">
        <div class="player-info">
            <div class="now-playing">🎵 正在播放</div>
            <div class="song-name" id="playerSongName">选择一首音乐</div>
        </div>
        <div class="player-controls">
            <button class="player-btn" onclick="togglePlay()" id="playPauseBtn">⏸️ 暂停</button>
            <button class="player-btn" onclick="stopAll()">⏹️ 停止</button>
        </div>
        <div class="volume-control">
            <span>🔊</span>
            <input type="range" class="volume-slider" min="0" max="100" value="80" onchange="setVolume(this.value)">
        </div>
    </div>
</div>

<audio id="audioPlayer" preload="auto"></audio>

<script>
// Pixabay 音乐数据
const MUSIC_DATA = [
    {emotion: 'sad', icon:'😔', name: 'Sad Piano', artist:'Pixabay', url:'https://cdn.pixabay.com/download/audio/2022/05/27/audio_1885eb1270.mp3'},
    {emotion: 'relax', icon:'😌', name: 'Relaxing Piano', artist:'Pixabay', url:'https://cdn.pixabay.com/download/audio/2022/05/17/audio_24a0f42e21.mp3'},
    {emotion: 'photo', icon:'📸', name: 'Happy Whistle', artist:'Pixabay', url:'https://cdn.pixabay.com/download/audio/2022/03/24/audio_c610232532.mp3'},
    {emotion: 'social', icon:'👫', name: 'Good Night', artist:'Pixabay', url:'https://cdn.pixabay.com/download/audio/2022/03/10/audio_a1c8b7c8d2.mp3'},
    {emotion: 'art', icon:'🎨', name: 'Jazz Comedy', artist:'Pixabay', url:'https://cdn.pixabay.com/download/audio/2022/03/15/audio_2c0a8d9e3f.mp3'},
    {emotion: 'party', icon:'🎉', name: 'Party Animals', artist:'Pixabay', url:'https://cdn.pixabay.com/download/audio/2022/03/09/audio_0d2e6a7f8c.mp3'},
    {emotion: 'date', icon:'💕', name: 'Romantic Guitar', artist:'Pixabay', url:'https://cdn.pixabay.com/download/audio/2022/04/27/audio_8f5d9e2a1b.mp3'},
    {emotion: 'family', icon:'👨‍👩‍👧', name: 'Happy Family', artist:'Pixabay', url:'https://cdn.pixabay.com/download/audio/2022/03/28/audio_5e6f7a8b9c.mp3'},
    {emotion: 'food', icon:'🍜', name: 'Cooking Show', artist:'Pixabay', url:'https://cdn.pixabay.com/download/audio/2022/03/11/audio_3d4e5f6a7b.mp3'},
    {emotion: 'pray', icon:'🙏', name: 'Meditation', artist:'Pixabay', url:'https://cdn.pixabay.com/download/audio/2022/04/18/audio_9a8b7c6d5e.mp3'},
    {emotion: 'sport', icon:'⚽', name: 'Workout', artist:'Pixabay', url:'https://cdn.pixabay.com/download/audio/2022/03/22/audio_1b2c3d4e5f.mp3'},
    {emotion: 'lazy', icon:'🛋️', name: 'Lazy Sunday', artist:'Pixabay', url:'https://cdn.pixabay.com/download/audio/2022/04/05/audio_6f7a8b9c0d.mp3'},
    {emotion: 'explore', icon:'🔍', name: 'Adventure', artist:'Pixabay', url:'https://cdn.pixabay.com/download/audio/2022/03/30/audio_2c3d4e5f6a.mp3'}
];

let currentAudio = document.getElementById('audioPlayer');
let isPlaying = false;
let currentMusic = null;

// 初始化音乐网格
function initMusicGrid() {
    const grid = document.getElementById('musicGrid');
    grid.innerHTML = MUSIC_DATA.map(music => `
        <div class="music-card" onclick="playMusic('${music.emotion}')">
            <div class="icon">${music.icon}</div>
            <div class="emotion">${music.emotion}</div>
            <div class="name">${music.name}</div>
            <div class="artist">${music.artist}</div>
        </div>
    `).join('');
}

// 播放音乐
function playMusic(emotion) {
    const music = MUSIC_DATA.find(m => m.emotion === emotion);
    if (!music) return;
    
    // 移除之前的播放状态
    document.querySelectorAll('.music-card').forEach(card => card.classList.remove('playing'));
    
    // 设置音频
    currentAudio.src = music.url;
    currentMusic = music;
    
    // 播放
    currentAudio.play().then(() => {
        isPlaying = true;
        updatePlayerUI(music);
        highlightCard(emotion);
        log(`✅ 开始播放：${music.name}`);
    }).catch(err => {
        console.error('播放失败:', err);
        log(`❌ 播放失败：${music.name}\n${err}`);
    });
}

// 更新播放器 UI
function updatePlayerUI(music) {
    document.getElementById('playerBar').classList.add('show');
    document.getElementById('playerSongName').textContent = `${music.name} - ${music.artist}`;
    document.getElementById('playPauseBtn').textContent = '⏸️ 暂停';
}

// 高亮当前卡片
function highlightCard(emotion) {
    document.querySelectorAll('.music-card').forEach(card => {
        card.classList.remove('playing');
        if (card.querySelector('.emotion').textContent === emotion) {
            card.classList.add('playing');
        }
    });
}

// 切换播放/暂停
function togglePlay() {
    if (isPlaying) {
        currentAudio.pause();
        isPlaying = false;
        document.getElementById('playPauseBtn').textContent = '▶️ 播放';
        log('⏸️ 音乐已暂停');
    } else {
        currentAudio.play();
        isPlaying = true;
        document.getElementById('playPauseBtn').textContent = '⏸️ 暂停';
        log('▶️ 音乐已恢复');
    }
}

// 停止所有
function stopAll() {
    currentAudio.pause();
    currentAudio.currentTime = 0;
    isPlaying = false;
    currentMusic = null;
    document.getElementById('playerBar').classList.remove('show');
    document.querySelectorAll('.music-card').forEach(card => card.classList.remove('playing'));
    document.getElementById('playPauseBtn').textContent = '▶️ 播放';
    log('⏹️ 音乐已停止');
}

// 设置音量
function setVolume(value) {
    currentAudio.volume = value / 100;
    log(`🔊 音量：${value}%`);
}

// 测试所有音乐
async function testAllMusic() {
    const resultDiv = document.getElementById('testResult');
    resultDiv.textContent = '🧪 开始测试所有音乐...\n\n';
    
    for (let i = 0; i < MUSIC_DATA.length; i++) {
        const music = MUSIC_DATA[i];
        resultDiv.textContent += `🎵 测试 ${i+1}/${MUSIC_DATA.length}: ${music.name}... `;
        
        currentAudio.src = music.url;
        
        try {
            await new Promise((resolve, reject) => {
                const timeout = setTimeout(() => reject(new Error('加载超时')), 10000);
                
                currentAudio.oncanplaythrough = () => {
                    clearTimeout(timeout);
                    resolve();
                };
                
                currentAudio.onerror = (e) => {
                    clearTimeout(timeout);
                    reject(new Error('加载失败'));
                };
                
                currentAudio.load();
            });
            
            resultDiv.textContent += '✅ 成功\n';
        } catch (err) {
            resultDiv.textContent += `❌ 失败：${err.message}\n`;
        }
        
        await new Promise(resolve => setTimeout(resolve, 500));
    }
    
    resultDiv.textContent += '\n✨ 测试完成！\n';
    stopAll();
}

// 日志
function log(message) {
    const resultDiv = document.getElementById('testResult');
    const time = new Date().toLocaleTimeString();
    resultDiv.textContent = `[${time}] ${message}\n` + resultDiv.textContent;
}

// 事件监听
currentAudio.addEventListener('ended', () => {
    log('✅ 音乐播放完毕');
    isPlaying = false;
    document.getElementById('playPauseBtn').textContent = '▶️ 播放';
});

currentAudio.addEventListener('error', (e) => {
    log(`❌ 播放错误：${e.message}`);
});

// 初始化
initMusicGrid();
log('🎵 音乐测试页面已就绪，点击卡片开始播放');
</script>
</body>
</html>
