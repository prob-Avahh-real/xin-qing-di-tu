<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>音乐播放器测试</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:-apple-system,sans-serif;background:linear-gradient(135deg,#f9e0c0,#fce4bc);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
        .player{background:white;border-radius:32px;padding:40px;max-width:500px;width:100%;box-shadow:0 12px 36px rgba(0,0,0,0.15)}
        .player h2{text-align:center;color:#E87A5D;margin-bottom:24px}
        .music-list{display:flex;flex-direction:column;gap:12px}
        .music-item{background:#fef7f2;border-radius:16px;padding:16px;cursor:pointer;transition:all 0.2s;border:2px solid transparent}
        .music-item:hover{border-color:#F9B572;background:#fef0e6}
        .music-item.active{border-color:#F9B572;background:linear-gradient(135deg,#fef3e4,#fee6d6)}
        .music-item .header{display:flex;align-items:center;gap:12px}
        .music-item .emoji{font-size:2rem}
        .music-item .info{flex:1}
        .music-item .name{font-weight:600;color:#5a4a42;margin-bottom:4px}
        .music-item .artist{font-size:0.85rem;color:#7a5a48}
        .music-item .play-btn{background:#F9B572;color:white;border:none;padding:8px 16px;border-radius:20px;font-size:0.8rem;font-weight:600;cursor:pointer}
        .now-playing{background:linear-gradient(135deg,#F9B572,#E87A5D);color:white;border-radius:20px;padding:20px;margin-bottom:20px;text-align:center}
        .now-playing .label{font-size:0.85rem;opacity:0.9;margin-bottom:8px}
        .now-playing .song-name{font-size:1.2rem;font-weight:700;margin-bottom:4px}
        .now-playing .artist-name{font-size:0.95rem;opacity:0.9}
        .controls{display:flex;justify-content:center;gap:16px;margin-top:16px}
        .controls button{background:white;color:#E87A5D;border:2px solid white;padding:12px 24px;border-radius:28px;font-size:1rem;font-weight:600;cursor:pointer;transition:all 0.2s}
        .controls button:hover{background:rgba(255,255,255,0.2)}
        .status{margin-top:16px;padding:12px;border-radius:12px;font-size:0.85rem;text-align:center}
        .status.error{background:#fee2e2;color:#dc2626}
        .status.success{background:#d1fae5;color:#059669}
        .status.loading{background:#fef3c7;color:#92400e}
    </style>
</head>
<body>
<div class="player">
    <h2>🎵 音乐播放器测试</h2>
    
    <div id="nowPlaying" class="now-playing" style="display:none">
        <div class="label">正在播放</div>
        <div class="song-name" id="npName">--</div>
        <div class="artist-name" id="npArtist">--</div>
        <div class="controls">
            <button onclick="togglePlay()">⏯️ 播放/暂停</button>
            <button onclick="stopMusic()">⏹️ 停止</button>
        </div>
    </div>
    
    <div class="music-list">
        <div class="music-item" onclick="playMusic('sad', '遇见', '孙燕姿', 'https://music.163.com/song/media/outer/url?id=186016.mp3')">
            <div class="header">
                <span class="emoji">😔</span>
                <div class="info">
                    <div class="name">遇见</div>
                    <div class="artist">孙燕姿 - EMO 治愈</div>
                </div>
                <button class="play-btn">▶️ 播放</button>
            </div>
        </div>
        
        <div class="music-item" onclick="playMusic('relax', '起风了', '买辣椒也用券', 'https://music.163.com/song/media/outer/url?id=402592562.mp3')">
            <div class="header">
                <span class="emoji">😌</span>
                <div class="info">
                    <div class="name">起风了</div>
                    <div class="artist">买辣椒也用券 - 散心</div>
                </div>
                <button class="play-btn">▶️ 播放</button>
            </div>
        </div>
        
        <div class="music-item" onclick="playMusic('photo', '夏天的风', '温岚', 'https://music.163.com/song/media/outer/url?id=186790.mp3')">
            <div class="header">
                <span class="emoji">📸</span>
                <div class="info">
                    <div class="name">夏天的风</div>
                    <div class="artist">温岚 - 拍照</div>
                </div>
                <button class="play-btn">▶️ 播放</button>
            </div>
        </div>
        
        <div class="music-item" onclick="playMusic('social', '小幸运', '田馥甄', 'https://music.163.com/song/media/outer/url?id=32834544.mp3')">
            <div class="header">
                <span class="emoji">👫</span>
                <div class="info">
                    <div class="name">小幸运</div>
                    <div class="artist">田馥甄 - 聚会</div>
                </div>
                <button class="play-btn">▶️ 播放</button>
            </div>
        </div>
        
        <div class="music-item" onclick="playMusic('art', 'City of Stars', 'La La Land OST', 'https://music.163.com/song/media/outer/url?id=445393841.mp3')">
            <div class="header">
                <span class="emoji">🎨</span>
                <div class="info">
                    <div class="name">City of Stars</div>
                    <div class="artist">La La Land - 文艺</div>
                </div>
                <button class="play-btn">▶️ 播放</button>
            </div>
        </div>
        
        <div class="music-item" onclick="playMusic('food', '甜蜜蜜', '邓丽君', 'https://music.163.com/song/media/outer/url?id=186020.mp3')">
            <div class="header">
                <span class="emoji">🍜</span>
                <div class="info">
                    <div class="name">甜蜜蜜</div>
                    <div class="artist">邓丽君 - 美食</div>
                </div>
                <button class="play-btn">▶️ 播放</button>
            </div>
        </div>
    </div>
    
    <div id="status" class="status" style="display:none"></div>
</div>

<audio id="audioPlayer" preload="auto"></audio>

<script>
let currentAudio = null;
let isPlaying = false;

function playMusic(emotion, name, artist, url) {
    const audio = document.getElementById('audioPlayer');
    const status = document.getElementById('status');
    const nowPlaying = document.getElementById('nowPlaying');
    
    // 停止当前播放
    if (currentAudio) {
        audio.pause();
        audio.currentTime = 0;
    }
    
    // 显示正在播放
    nowPlaying.style.display = 'block';
    document.getElementById('npName').textContent = name;
    document.getElementById('npArtist').textContent = artist;
    
    // 设置状态
    status.style.display = 'block';
    status.className = 'status loading';
    status.textContent = '🔄 正在加载音乐...';
    
    // 播放音乐
    audio.src = url;
    audio.volume = 0.7;
    
    audio.oncanplay = () => {
        status.className = 'status success';
        status.textContent = '✅ 加载成功，开始播放';
        audio.play().then(() => {
            isPlaying = true;
            console.log('🎵 开始播放:', name, artist);
        }).catch(err => {
            status.className = 'status error';
            status.textContent = '❌ 播放失败：' + err.message;
            console.error('播放失败:', err);
        });
    };
    
    audio.onerror = (e) => {
        status.className = 'status error';
        status.textContent = '❌ 加载失败：网易云音乐链接可能失效或被墙';
        console.error('加载失败:', e);
        
        // 尝试备用方案
        setTimeout(() => {
            tryAlternate(emotion, name, artist);
        }, 1000);
    };
    
    audio.onended = () => {
        isPlaying = false;
        status.textContent = '✅ 播放完成';
        setTimeout(() => status.style.display = 'none', 3000);
    };
}

function togglePlay() {
    const audio = document.getElementById('audioPlayer');
    if (isPlaying) {
        audio.pause();
        isPlaying = false;
    } else {
        audio.play();
        isPlaying = true;
    }
}

function stopMusic() {
    const audio = document.getElementById('audioPlayer');
    audio.pause();
    audio.currentTime = 0;
    isPlaying = false;
    document.getElementById('nowPlaying').style.display = 'none';
    document.getElementById('status').style.display = 'none';
}

// 备用音乐源（如果网易云失效）
function tryAlternate(emotion, name, artist) {
    const alternates = {
        sad: 'https://api.uomg.com/api/rand.music?sort=热歌榜&format=mp3',
        relax: 'https://api.uomg.com/api/rand.music?sort=热歌榜&format=mp3',
        photo: 'https://api.uomg.com/api/rand.music?sort=热歌榜&format=mp3',
        social: 'https://api.uomg.com/api/rand.music?sort=热歌榜&format=mp3',
        art: 'https://api.uomg.com/api/rand.music?sort=热歌榜&format=mp3',
        food: 'https://api.uomg.com/api/rand.music?sort=热歌榜&format=mp3'
    };
    
    const status = document.getElementById('status');
    status.textContent = '🔄 尝试备用音乐源...';
    
    // 注意：备用源需要特殊处理，这里只是示例
    console.log('备用源:', alternates[emotion]);
}

// 高亮当前播放
document.querySelectorAll('.music-item').forEach(item => {
    item.addEventListener('click', function() {
        document.querySelectorAll('.music-item').forEach(i => i.classList.remove('active'));
        this.classList.add('active');
    });
});
</script>
</body>
</html>
