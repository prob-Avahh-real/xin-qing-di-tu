<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>心情地图 - 主 APP</title>
    <script src="https://webapi.amap.com/maps?v=2.0&key=03e7166e1e73fbe7d922efa31319be77"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:-apple-system,sans-serif;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);min-height:100vh;padding:20px;padding-top:70px}
        .container{max-width:800px;margin:0 auto}
        header{text-align:center;color:white;margin-bottom:30px}
        header h1{font-size:2rem;margin-bottom:10px}
        header p{opacity:0.9}
        .card{background:white;border-radius:16px;padding:20px;margin-bottom:20px;box-shadow:0 10px 30px rgba(0,0,0,0.2)}
        .emotion-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
        .emotion-btn{background:#f5f5f5;border:2px solid #e0e0e0;padding:15px 10px;border-radius:12px;font-size:0.9rem;cursor:pointer;transition:all 0.3s}
        .emotion-btn:hover{background:#667eea;color:white;border-color:#667eea;transform:translateY(-2px)}
        .emotion-btn.active{background:linear-gradient(135deg,#667eea,#764ba2);color:white;border-color:transparent}
        .emotion-btn .emoji{font-size:1.8rem;display:block;margin-bottom:5px}
        .route-display{margin-top:20px}
        .route-card{background:linear-gradient(135deg,#f5f7fa,#c3cfe2);border-radius:12px;padding:20px;margin-bottom:20px}
        .route-card h2{font-size:1.5rem;margin-bottom:10px;color:#333}
        .stats{display:flex;gap:15px;margin:15px 0;flex-wrap:wrap}
        .stat{background:white;padding:8px 15px;border-radius:20px;font-size:0.85rem;font-weight:500}
        .poi-list{margin-top:15px}
        .poi-item{background:white;padding:15px;border-radius:8px;margin-bottom:12px;border-left:4px solid #667eea}
        .poi-item h3{font-size:1.1rem;margin-bottom:8px;color:#333}
        .poi-item p{font-size:0.9rem;color:#666;margin:5px 0}
        .tags{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
        .tag{background:#f0f0f0;padding:4px 8px;border-radius:4px;font-size:0.75rem;color:#666}
        .loading{text-align:center;padding:40px 20px}
        .spinner{width:40px;height:40px;border:4px solid #e0e0e0;border-top-color:#667eea;border-radius:50%;animation:spin 1s linear infinite;display:inline-block;margin-bottom:10px}
        @keyframes spin{to{transform:rotate(360deg)}}
        #mapContainer{width:100%;height:300px;border-radius:12px;margin-bottom:20px}
        .badge{display:inline-block;padding:4px 8px;border-radius:4px;font-size:0.75rem;font-weight:600;margin-left:10px}
        .badge-success{background:#52c41a;color:white}
    </style>
</head>
<body>

    </div>

        <a href="demo-judge-fixed.html" style="color:white;text-decoration:none;padding:6px 12px;background:rgba(255,255,255,0.2);border-radius:6px;font-size:0.9rem">🎭 演示</a>
        <a href="points-mall-app.html" style="color:white;text-decoration:none;padding:6px 12px;background:rgba(255,255,255,0.2);border-radius:6px;font-size:0.9rem">🎁 积分</a>

</div>

            <button class="emotion-btn" data-emotion="explore"><span class="emoji">🗺️</span><span>探索新发现</span></button>
            <button class="emotion-btn" data-emotion="food"><span class="emoji">🍜</span><span>吃货寻美食</span></button>
            <button class="emotion-btn" data-emotion="lucky"><span class="emoji">🙏</span><span>祈福求好运</span></button>
            <button class="emotion-btn" data-emotion="fitness"><span class="emoji">🚴</span><span>运动出点汗</span></button>
            <button class="emotion-btn" data-emotion="chill"><span class="emoji">🌅</span><span>躺平放松</span></button>
        </div>
    </div>

    <div class="card">
        <h2>🗺️ 路线规划</h2>
        <div id="mapContainer"></div>
        <div id="routeDisplay" class="route-display"></div>
    </div>
</div>

        {name:"塔影空间", why:"角落位置，安静发呆", score:"⭐⭐⭐⭐⭐", hook:"咖啡 8 折", tip:"窗边", time:120, cost:38, tags:["咖啡","安静"]}
    ]
};

const EMOTION_NAMES = {
    sad: '治愈疗愈之旅',
    relax: '独自放空之旅',
    photo: '出片打卡之旅',
    social: '潮人社交之旅',
    art: '艺术灵感之旅',
    date: '浪漫约会之旅',
    family: '亲子家庭之旅',
    explore: '秘境探索之旅',
    food: '美食探店之旅',
    lucky: '祈福求运之旅',
    fitness: '运动活力之旅',
    chill: '躺平放松之旅'
};

const EMOTION_MATCH = {
    sad: '难过的时候，让美食和猫咪治愈你',
    relax: '一个人，一杯咖啡，一个下午',
    photo: '每个角度都是大片',
    social: '和朋友一起，快乐加倍',
    art: '浸润在艺术里，灵感爆发',
    date: '牵手漫步，甜蜜满分',
    family: '全家出游，老少皆宜',
    explore: '发现不一样的龙华',
    food: '吃遍龙华，不胖不归',
    lucky: '心诚则灵，好运连连',
    fitness: '出汗排毒，身心舒畅',
    chill: '什么都不做，就很美好'
};

let map;

// 初始化地图
function initMap() {
    try {
        map = new AMap.Map('mapContainer', {
            zoom: 15,
            center: [121.444807, 31.180147],
            mapStyle: 'amap://styles/light'
        });
        console.log('✅ 地图初始化成功');
    } catch (error) {
        console.error('❌ 地图初始化失败:', error);
    }
}

// 情绪按钮点击事件
document.querySelectorAll('.emotion-btn').forEach(btn => {
    btn.addEventListener('click', function() {
        document.querySelectorAll('.emotion-btn').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        
        const emotion = this.dataset.emotion;
        displayRoute(emotion);
    });
});

// 显示路线
function displayRoute(emotion) {
    const pois = POI_DATA[emotion];
    const theme = EMOTION_NAMES[emotion];
    const match = EMOTION_MATCH[emotion];
    const totalTime = pois.reduce((sum, p) => sum + p.time, 0) / 60;
    const totalCost = pois.reduce((sum, p) => sum + p.cost, 0);
    
    const routeDisplay = document.getElementById('routeDisplay');
    routeDisplay.innerHTML = `
        <div class="route-card">
            <h2>🗺️ ${theme}</h2>
            <p style="color:#666;margin-bottom:10px;">${match}</p>
            <div class="stats">
                <span class="stat">📍 ${pois.length}个景点</span>
                <span class="stat">⏱️ ${totalTime.toFixed(1)}小时</span>
                <span class="stat">💰 约${totalCost}元</span>
            </div>
            <div class="poi-list">
                ${pois.map((poi, idx) => `
                    <div class="poi-item">
                        <h3>${idx+1}. ${poi.name}</h3>
                        <p>💡 ${poi.why}</p>
                        <p>🎫 ${poi.hook} | ⏱️ ${poi.time}分钟 | 💰 ${poi.cost}元</p>
                        <div class="tags">
                            ${poi.tags.map(tag => `<span class="tag">${tag}</span>`).join('')}
                        </div>
                    </div>
                `).join('')}
            </div>
        </div>
    `;
    
    document.getElementById('routeBadge').style.display = 'inline-block';
    
    // 在地图上标记景点
    if (map) {
        addMarkers(pois);
    }
}

// 添加标记
function addMarkers(pois) {
    // 清除旧标记
    if (map && map.getAllOverlays) {
        const overlays = map.getAllOverlays();
        overlays.forEach(overlay => map.remove(overlay));
    }
    
    // 添加新标记
    pois.forEach((poi, index) => {
        const marker = new AMap.Marker({
            position: [121.444807 + index * 0.001, 31.180147 + index * 0.001],
            title: poi.name,
            map: map
        });
    });
}

// 页面加载完成
window.addEventListener('load', () => {
    console.log('✅ 页面加载完成');
    initMap();
    
    // 自动选择第一个情绪
    setTimeout(() => {
        const firstBtn = document.querySelector('[data-emotion="sad"]');
        if (firstBtn) {
            firstBtn.click();
        }
    }, 500);
});
</script>
