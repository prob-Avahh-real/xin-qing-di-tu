// 鐢熸垚浜岀淮鐮?function generateQRCode() {

    QRCode.toCanvas(url, {
        width: 180,
        margin: 2,
        color: {
            dark: '#667eea',
            light: '#ffffff'

        if (error) {
            qrContainer.innerHTML = '<div style="color:#f5222d;">浜岀淮鐮佺敓鎴愬け璐?/div>';
            console.error('QR Code error:', error);

}

// API 鏃ュ織
function logAPI(type, endpoint, data) {
    const logDiv = document.getElementById('apiLog');
    const timestamp = new Date().toLocaleTimeString();
    const logEntry = document.createElement('div');
    
    if (type === 'request') {
        logEntry.className = 'request';
        logEntry.innerHTML = `[${timestamp}] 馃摛 ${endpoint}<br><span style="color:#9cdcfe">${JSON.stringify(data, null, 2)}</span>`;
    } else {
        logEntry.className = 'response';
        logEntry.innerHTML = `[${timestamp}] 馃摜 ${endpoint}<br><span style="color:#ce9178">${JSON.stringify(data, null, 2)}</span>`;
    }
    
    logDiv.appendChild(logEntry);
    logDiv.scrollTop = logDiv.scrollHeight;
}
