// 用户当前位置（默认龙华寺）
let userLocation = {lat: 31.180147, lng: 121.444807};
let currentFilter = 'smart';
let map;
let markers = [];

// 计算距离（简化版）
function calculateDistance(lat1, lng1, lat2, lng2) {
    const R = 6371;
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLng = (lng2 - lng1) * Math.PI / 180;
    const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
              Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
              Math.sin(dLng/2) * Math.sin(dLng/2);
    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    return (R * c * 1000).toFixed(0);
}

// 智能推荐算法
function getSmartRecommendation() {
    let scored = PARKING_DATA.map(p => {
        const distance = calculateDistance(userLocation.lat, userLocation.lng, p.lat, p.lng);
        const availability = p.available / p.total;
        const priceScore = p.price === 0 ? 100 : 100 - p.price;
        
        // 综合评分
        let score = 0;
        
        // 距离分（40%）
        if (distance < 200) score += 40;
        else if (distance < 500) score += 30;
        else if (distance < 1000) score += 20;
        else score += 10;
        
        // 可用性分（40%）
        score += availability * 40;
        
        // 价格分（20%）
        score += (priceScore / 100) * 20;
        
        // 已满直接 0 分
        if (p.available === 0) score = 0;
        
        return {...p, distance, score};
    });
    
    scored.sort((a, b) => b.score - a.score);
    return scored[0];
}

// 筛选停车场
function filterParking(type) {
    currentFilter = type;
    
    // 更新按钮状态
    document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
    event.target.classList.add('active');
    
    let filtered = [...PARKING_DATA];
    
    switch(type) {
        case 'smart':
            const rec = getSmartRecommendation();
            renderParkingList([rec, ...PARKING_DATA.filter(p => p.id !== rec.id)]);
            updateRecommendation(rec);
            return;
        case 'nearest':
            filtered.sort((a, b) => {
                const distA = calculateDistance(userLocation.lat, userLocation.lng, a.lat, a.lng);
                const distB = calculateDistance(userLocation.lat, userLocation.lng, b.lat, b.lng);
                return distA - distB;
            });
            break;
        case 'available':
            filtered.sort((a, b) => b.available - a.available);
            break;
        case 'cheap':
            filtered.sort((a, b) => a.price - b.price);
            break;
        case 'free':
            filtered = filtered.filter(p => p.price === 0);
            break;
    }
    
    const rec = getSmartRecommendation();
    renderParkingList(filtered);
    updateRecommendation(rec);
}

// 更新推荐
function updateRecommendation(parking) {
    const reasonEl = document.getElementById('recommendReason');
    const highlightsEl = document.getElementById('recommendHighlights');
    
    const distance = calculateDistance(userLocation.lat, userLocation.lng, parking.lat, parking.lng);
    const rate = (parking.available / parking.total * 100).toFixed(0);
    
    let reasons = [];
    if (distance < 200) reasons.push('距离最近');
    if (parking.available > parking.total * 0.5) reasons.push('车位充足');
    if (parking.price === 0) reasons.push('免费停车');
    if (parking.price > 0 && parking.price <= 8) reasons.push('价格实惠');
    if (rate > 50) reasons.push(`空闲率${rate}%`);
    
    reasonEl.innerHTML = `📍 ${parking.name} · ${distance}米 · ${parking.available}/${parking.total}车位 · ${parking.price === 0 ? '免费' : parking.price + '元/小时'}`;
    
    highlightsEl.innerHTML = reasons.map(r => `<span>${r}</span>`).join('');
}

// 渲染列表
function renderParkingList(parkings) {
    const listEl = document.getElementById('parkingList');
    const rec = getSmartRecommendation();
    
    listEl.innerHTML = parkings.map(p => {
        const distance = calculateDistance(userLocation.lat, userLocation.lng, p.lat, p.lng);
        const rate = (p.available / p.total * 100).toFixed(0);
        const isRecommended = p.id === rec.id;
        const isSelected = false;
        
        let statusTag;
        if (p.available === 0) {
            statusTag = '<span class="tag tag-danger">已满</span>';
        } else if (rate < 20) {
            statusTag = '<span class="tag tag-danger">紧张</span>';
        } else if (rate < 50) {
            statusTag = '<span class="tag tag-warning">适中</span>';
        } else {
            statusTag = '<span class="tag tag-success">充足</span>';
        }
        
        return `
            <div class="parking-item ${isRecommended ? 'recommended' : ''}" onclick="selectParking('${p.id}')">
                <div class="parking-info">
                    <h3>${p.name}</h3>
                    <div class="address">📍 ${p.address}</div>
                    <div class="tags">
                        ${statusTag}
                        <span class="tag tag-info">${p.price === 0 ? '免费' : p.price + '元/小时'}</span>
                        ${p.features.map(f => `<span class="tag">${f}</span>`).join('')}
                    </div>
                </div>
                <div style="display:flex;align-items:center;gap:15px">
                    <div class="parking-stats">
                        <div class="stat">
                            <div class="label">距离</div>
                            <div class="value ${distance < 300 ? 'good' : distance < 800 ? 'warning' : 'bad'}">${distance}米</div>
                        </div>
                        <div class="stat">
                            <div class="label">空闲</div>
                            <div class="value ${rate > 50 ? 'good' : rate > 20 ? 'warning' : 'bad'}">${p.available}/${p.total}</div>
                        </div>
                    </div>
                    <div class="distance-badge">${distance}m</div>
                    <button class="nav-btn" onclick="event.stopPropagation();navigateTo('${p.id}')">🗺️ 导航</button>
                </div>
            </div>
        `;
    }).join('');
}

// 选择停车场
function selectParking(id) {
    document.querySelectorAll('.parking-item').forEach(item => item.classList.remove('selected'));
    event.currentTarget.classList.add('selected');
}

// 导航到停车场
function navigateTo(id) {
    const parking = PARKING_DATA.find(p => p.id === id);
    if (!parking) return;
    
    // 使用高德地图导航
    const url = `https://uri.amap.com/navigation?from=0,0&to=${parking.lng},${parking.lat}&policy=0`;
    window.open(url, '_blank');
}

// 初始化地图
function initMap() {
    map = new AMap.Map('mapContainer', {
        zoom: 15,
        center: [userLocation.lng, userLocation.lat],
        mapStyle: 'amap://styles/light'
    });
    
    // 添加用户位置标记
    new AMap.Marker({
        position: [userLocation.lng, userLocation.lat],
        title: '我的位置',
        map: map,
        icon: 'https://webapi.amap.com/theme/v1.3/markers/n/mark_b.png'
    });
    
    // 添加停车场标记
    PARKING_DATA.forEach((p, index) => {
        const color = p.available === 0 ? 'red' : p.available / p.total > 0.5 ? 'green' : 'orange';
        const marker = new AMap.Marker({
            position: [p.lng, p.lat],
            title: `${p.name} (${p.available}/${p.total})`,
            map: map
        });
        
        marker.on('click', () => {
            selectParking(p.id);
            const item = document.querySelectorAll('.parking-item')[index];
            if (item) item.scrollIntoView({behavior: 'smooth', block: 'center'});
        });
        
        markers.push(marker);
    });
}

// 页面加载完成
window.addEventListener('load', () => {
    console.log('✅ 停车引导页面加载完成');
    
    try {
        initMap();
        const rec = getSmartRecommendation();
        updateRecommendation(rec);
        filterParking('smart');
    } catch (error) {
        console.error('❌ 地图加载失败:', error);
        // 地图失败不影响列表显示
        const rec = getSmartRecommendation();
        updateRecommendation(rec);
        filterParking('smart');
    }
});
