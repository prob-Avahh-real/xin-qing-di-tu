<body>

function playNaturalTTS(text){if(!window.speechSynthesis){showToast("浏览器不支持语音");return}window.speechSynthesis.cancel();const utterance=new SpeechSynthesisUtterance(text);utterance.lang='zh-CN';utterance.rate=1.4;utterance.pitch=1.8;utterance.volume=1;let voices=window.speechSynthesis.getVoices();if(voices.length===0){window.speechSynthesis.onvoiceschanged=()=>{voices=window.speechSynthesis.getVoices();setVoice()}}else{setVoice()}function setVoice(){const preferred=voices.find(v=>v.lang==='zh-CN'&&(v.name.includes('Tingting')||v.name.includes('Xiaoxiao')||v.name.includes('Huihui')));if(preferred)utterance.voice=preferred;window.speechSynthesis.speak(utterance)}}

async function callAgentAPI(query,emotion){await new Promise(r=>setTimeout(r,1300));const isPhoto=emotion==='photo',isSocial=emotion==='social',isArt=emotion==='art';let theme="自我疗愈�?;if(isPhoto)theme="出片打卡�?;else if(isSocial)theme="潮人社交�?;else if(isArt)theme="艺术灵感�?;const song=MUSIC_MAP[emotion]||MUSIC_MAP.default;return{theme,emotion_match:isPhoto?"想出片→视觉炸裂机位":isSocial?"和朋友→看展 + 晚饭 + 夜生�?:isArt?"文艺灵感→艺术浸�?:"安静 + 美食 + 独处",total_photo_spots:isPhoto?5:3,total_savings:isPhoto?"15":"8",points_earned:50,route:[{name:"龙华�?,why:"这里的猫比人更懂治愈，一碗热素面暖进心里",score:"⭐⭐⭐⭐",hook:"�?5 元素面券",tip:"寺里有只大橘猫叫'福来'，摸它耳朵会有好运",lat:31.180147,lng:121.444807},{name:"塔影空间",why:"水下倒影 + 金色穹顶�? 张图都不够发",score:"⭐⭐⭐⭐�?,hook:"领咖�?8 折券",tip:"穿白色衣服倒影效果最�?,lat:31.178943,lng:121.446231},{name:isSocial?"西岸梦中�?:"西岸滨江",why:isSocial?"水泥厂变身潮人食堂，夜生活满�?:"看着日落慢慢呼吸，难过也是风�?,score:"⭐⭐⭐⭐",hook:isSocial?"精酿买一送一�?:"咖啡车买一赠一",tip:isSocial?"每周五六日有露天电影":"下午 5:20-5:40 江面最�?,lat:31.175234,lng:121.448765}],song,cat_egg:{name:"福来",story:"摸左耳招桃花，摸右耳招财运",location:"龙华寺天王殿右侧石阶"},weather_egg:{tip:"☀�?今天阳光满分，塔影空间的水下倒影会特别清晰！"},social_copy:["今天在龙华，和千年古塔喝了一杯咖啡�?龙华灵境向导","福来说：摸左耳招桃花�?上海拍照"],daily:{name:"1 小时印章猎人",desc:"1 小时内集�?3 �?AR 印章",reward:"西岸美式咖啡"}}}

function shareToFriends(){if(!currentRouteData){showToast("请先生成路线");return}const text=currentRouteData.social_copy[0]+"\n#龙华灵境向导";if(navigator.share){navigator.share({title:"龙华·灵境向导",text:text,url:location.href}).catch(()=>{navigator.clipboard.writeText(text);showToast("文案已复�?)})}else{navigator.clipboard.writeText(text);showToast("文案已复制！快去朋友圈发布吧~")}}
