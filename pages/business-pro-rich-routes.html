let selectedType='medium',currentAudio=null,mapInstance=null,currentRouteData=null;
const TYPE_CONFIG={short:{ratio:0.3,name:'精华版'},medium:{ratio:0.6,name:'丰富版'},full:{ratio:1,name:'完整版'}};

function playNaturalTTS(text){
    if(!window.speechSynthesis){showToast("浏览器不支持语音");return}
    window.speechSynthesis.cancel();
    const utterance=new SpeechSynthesisUtterance(text);
    utterance.lang='zh-CN';utterance.rate=1.4;utterance.pitch=1.8;
    let voices=window.speechSynthesis.getVoices();
    if(voices.length===0){
        window.speechSynthesis.onvoiceschanged=()=>{
            voices=window.speechSynthesis.getVoices();
            const preferred=voices.find(v=>v.lang==='zh-CN');
            if(preferred)utterance.voice=preferred
        }
    }
    window.speechSynthesis.speak(utterance)
}

function playRealMusic(songUrl,songName){
    if(currentAudio){currentAudio.pause()}
    const audio=document.getElementById('bgAudio');
    audio.src=songUrl;audio.play().catch(err=>showToast("🎵 请点击页面播放"));currentAudio=audio;
    showToast(`🎵 正在播放：${songName}`)
}

function stopMusic(){
    if(currentAudio){currentAudio.pause();currentAudio=null}
    showToast("音乐已停止")
}

async function callAgentAPI(query,emotion){
    await new Promise(r=>setTimeout(r,800));
    const allPoints=ALL_POIS[emotion]||ALL_POIS.sad;
    const config=TYPE_CONFIG[selectedType];
    const count=Math.max(3,Math.floor(allPoints.length*config.ratio));
    const selectedPoints=allPoints.slice(0,count);
    const totalTime=selectedPoints.reduce((sum,p)=>sum+p.time,0)/60;
    const totalCost=selectedPoints.reduce((sum,p)=>sum+p.cost,0);
    const song=MUSIC_MAP[emotion]||MUSIC_MAP.sad;
    return{theme:getTheme(emotion),match:getMatch(emotion),points:selectedPoints,totalTime:totalTime.toFixed(1),totalCost,song}
}

function initMap(lat,lng,points){
    if(!window.AMap){
        document.getElementById('mapContainer').innerHTML='<div style="background:#fdf5ef;height:100%;display:flex;align-items:center;justify-content:center;color:#b77b5c">🗺️ 地图加载中...</div>';
        return
    }
    if(mapInstance)mapInstance.destroy();
    const map=new AMap.Map('mapContainer',{zoom:14,center:[lng,lat],mapStyle:'amap://styles/light'});
    points.forEach((p,i)=>{
        new AMap.Marker({position:[p.lng,p.lat],title:p.name,map:map,label:{content:`${i+1}. ${p.name}`,offset:new AMap.Pixel(0,-25)}})
    });
    if(points.length>=2){
        new AMap.Polyline({path:points.map(p=>[p.lng,p.lat]),strokeColor:"#F9B572",strokeWeight:5,map:map})
    }
    mapInstance=map
}

async function generateRoute(){
    const custom=document.getElementById('customQuery').value;
    const active=document.querySelector('.emotion-btn.active');
    const emotion=active?active.dataset.emotion:'sad';
    document.getElementById('loading').style.display='block';
    document.getElementById('routeDisplay').style.display='none';
    const data=await callAgentAPI(custom,emotion);
    currentRouteData=data;
    document.getElementById('routeTheme').innerText=data.theme;
    document.getElementById('emotionMatch').innerText=data.match;
    document.getElementById('totalPoints').innerText=data.points.length;
    document.getElementById('totalTime').innerText=data.totalTime;
    document.getElementById('totalCost').innerText=data.totalCost;
    const container=document.getElementById('routeCards');
    container.innerHTML='';
    data.points.forEach((poi,idx)=>{
        const card=document.createElement('div');
        card.className='poi-card';
        card.onclick=()=>openPoiDetail(poi,idx);
        card.innerHTML=`<h3>${idx+1}. ${poi.name}</h3><div class="rating">${poi.score}</div><div class="heal-text">💡 ${poi.why}</div><div class="coupon-tag">⏱️ ${poi.time}分钟 · 💰 ${poi.cost}元</div><span class="expand-hint">点击查看详情 ›</span>`;
        container.appendChild(card)
    });
    initMap(data.points[0].lat,data.points[0].lng,data.points);
    renderBusCard(emotion,data.points,data.totalTime);
    const bgmDiv=document.getElementById('bgmCard');
    bgmDiv.style.display='flex';
    bgmDiv.innerHTML=`<span style="flex:1">🎵 推荐 <strong>${data.song.name}</strong></span><button onclick="playRealMusic('${data.song.url}','${data.song.name}')">▶</button><button onclick="stopMusic()" style="margin-left:8px">⏹</button>`;
    document.getElementById('eggArea').innerHTML=`<div class="egg-item"><span>🐱 福来说：${getEgg(emotion)}</span></div>`;
    document.getElementById('loading').style.display='none';
    document.getElementById('routeDisplay').style.display='block';
    playNaturalTTS(`为你推荐${data.theme}，${data.match}`)
}

    "福来猫":{story:"福来是龙华寺的网红猫咪，因常年驻守在天王殿右侧石阶而得名。相传摸它的左耳能招桃花，摸右耳能招财运。它性格温顺，是游客们打卡必去的「活景点」。据说它原本是流浪猫，被寺内僧人收养后便在此安了家，已成为龙华寺最萌的守护神。",crowd:["猫奴","求好运","拍照打卡"],bestTime:"上午 · 猫咪晒太阳时最活跃",highlights:["招桃花","招财运","撸猫治愈","拍照出片"],tips:["带猫条效果更佳","不要强行抱猫","下午可能躲起来休息","猫条在入口小卖部有卖"]},
    "龙华寺素斋馆":{story:"龙华寺素斋馆是上海百年老字号素食餐厅，以素鸭、素面闻名。这里的素鸭用豆腐皮层层叠制，口感媲美真鸭。一碗素面只需15元，是龙华最具性价比的美食。许多食客专程从市区赶来，就为这一口传承百年的味道。",crowd:["素食爱好者","美食探店","预算有限"],bestTime:"上午11点前（避开午高峰）",highlights:["招牌素鸭","素面15元","百年老字号","功德满满"],tips:["11点前到不排队","素鸭必点","素面性价比最高","建议带现金"]},
    "塔影空间":{story:"塔影空间坐落于龙华寺旁，因能看到龙华塔在水中的倒影而得名。这是一座百年历史建筑改造的文艺咖啡馆，保留了青砖红瓦的老上海风情。二楼的露台是俯瞰龙华塔的最佳位置，清晨的光线穿过古塔洒入窗内，美得像一幅油画。",crowd:["文艺青年","约会","发呆放空"],bestTime:"下午2-5点 · 窗边光线最好",highlights:["龙华塔倒影","精品咖啡","安静角落","文创周边"],tips:["窗边位置最安静需早到","推荐塔影拿铁","带本书坐一下午","周末人多建议工作日来"]},
    "龙华烈士陵园":{story:"龙华烈士陵园是上海最大的烈士纪念地，原名「龙华淞沪警备司令部旧址」。这里安息着数以千计为革命牺牲的先烈。1927-1937年间，这里曾是国民党关押和杀害共产党人的主要场所，柔石、胡也频等左联作家就义于此。",crowd:["爱国主义教育","历史学习","安静缅怀"],bestTime:"工作日 · 周末也有团体参观",highlights:["烈士纪念馆","历史陈列","庄严氛围","免费参观"],tips:["保持安静肃穆","周一闭馆","免费需携带身份证","建议预留1小时"]},
    "西岸滨江":{story:"西岸滨江是上海黄浦江沿岸最美的亲水公共空间之一，全长11.4公里。由老工业码头改造而成，沿途有美术馆、艺术中心和众多咖啡馆。曾经这里是上海最重要的煤炭码头和水泥厂，如今蝶变为世界级的滨水文化走廊。",crowd:["散步跑步","情侣约会","亲子遛娃"],bestTime:"下午5:20日落时分最壮观",highlights:["江景日落","亲水步道","艺术场馆","咖啡车"],tips:["带外套江边风大","下午5:20江面最美","带耳机更享受","有公共自行车租赁"]},
    "龙美术馆":{story:"龙美术馆由中国收藏家刘益谦、王薇夫妇创办，是中国最大的私人美术馆之一。馆体由旧煤炭码头改造，粗犷的「煤漏斗」结构与精致的艺术品形成强烈对比。标志性的旋转楼梯是全上海最出片的建筑摄影取景地之一。",crowd:["艺术爱好者","摄影打卡","周末出游"],bestTime:"周一人最少 · 周末下午最热闹",highlights:["工业风建筑","当代艺术展","建筑摄影","旋转楼梯"],tips:["周一闭馆","学生票有优惠","旋转楼梯是网红打卡点","建议预留2小时"]},
    "西岸美术馆":{story:"西岸美术馆由法国蓬皮杜中心与上海西岸集团合作运营，展出蓬皮杜中心的馆藏杰作。纯白色几何建筑由普利兹克奖得主David Chipperfield设计，顶楼露台可以270度俯瞰黄浦江，是西岸最优雅的存在。",crowd:["国际展览","建筑设计","亲子活动"],bestTime:"工作日上午 · 周末有亲子工作坊",highlights:["蓬皮杜馆藏","白色建筑","亲子工作坊","江景露台"],tips:["学生票有优惠","顶楼露台可以看江景","周末有儿童活动","常设展+特展分开购票"]},
    "龙华塔":{story:"龙华塔始建于公元242年，为砖木结构八角七层楼阁式塔，高40.4米，是上海唯一留存的古塔。千百年来历经多次修缮，飞檐翘角依然如故。站在塔下仰望，塔影与天空交织，仿佛穿越千年的时光隧道。",crowd:["历史爱好者","摄影","祈福"],bestTime:"早上9点前 · 逆光最美",highlights:["1800年历史","上海唯一古塔","仰拍震撼","砖木结构"],tips:["9点前人少好拍照","穿汉服更出片","注意保护文物","登塔需另购门票"]},
    "龙华寺红墙":{story:"龙华寺的红墙是上海版的「故宫红墙」，朱红色的宫墙配上青灰色飞檐，是汉服摄影的绝佳背景。每年春天墙边的樱花盛开，花瓣飘落在红墙之上，那一刻你会忘记自己还在上海。",crowd:["汉服摄影","情侣拍照","打卡出片"],bestTime:"上午光线柔和 · 春天樱花季最佳",highlights:["故宫同款红墙","汉服绝佳背景","飞檐斗拱","樱花季限定"],tips:["穿汉服效果最好","上午光线柔和","人少时来拍","不要打扰寺庙秩序"]},
    "龙华老街":{story:"龙华老街是上海历史最悠久的商业街之一，保留了大量明清时期的建筑风貌。这里汇集了生煎、小笼、葱油饼等上海传统小吃。据说当年乾隆下江南路过此处，品尝了龙华素面后赞不绝口，御笔亲题「天下第一面」。",crowd:["美食爱好者","老上海风情","边走边吃"],bestTime:"上午8-10点 · 小吃最新鲜",highlights:["生煎小笼","葱油饼","老上海风情","百年老店"],tips:["早上8点来最热闹","建议空腹来","带现金部分老店不支持手机支付","边走边吃约1小时"]},
    "油罐艺术中心":{story:"油罐艺术中心由5个废弃航空储油罐改造而成，是全球少数以油罐为载体的当代艺术空间。每个油罐高12米、直径24米，站在巨大的穹顶之下仰望，仿佛置身科幻电影。这里的建筑本身就是一件巨大的艺术品。",crowd:["当代艺术","建筑爱好者","拍照打卡"],bestTime:"工作日 · 展览更新期最佳",highlights:["巨型油罐","沉浸式展览","独特空间","草坪景观"],tips:["带广角镜头","提前查展览信息","部分展览需预约","外部草坪免费开放"]},
    "西岸营地":{story:"西岸营地是黄浦江畔最大的户外休闲空间，大草坪可以野餐、飞盘、放风筝。这里是团建活动的热门场地，经常举办户外电影、音乐节等活动。黄昏时分，坐在草坪上看着江面被夕阳染成金色，是上海最浪漫的免费体验之一。",crowd:["团建聚会","亲子户外","野餐放风"],bestTime:"周末 · 周五晚有露天电影",highlights:["大草坪","飞盘","露天电影","江景野餐"],tips:["带野餐垫","周五六有活动","防晒霜必备","有免费饮用水"]},
    "龙华寺大雄宝殿":{story:"大雄宝殿是龙华寺的核心建筑，供奉着释迦牟尼佛。殿内香火鼎盛，是上海信众最集中的祈福场所之一。据说在这里许愿特别灵验，每逢初一十五更是香客如潮。殿前的两棵银杏树已有数百年树龄，秋天满地金黄。",crowd:["祈福许愿","佛教文化","求好运"],bestTime:"初一十五 · 早上7-8点",highlights:["佛祖金身","香火鼎盛","许愿灵验","百年银杏"],tips:["心诚则灵","免费领香在入口处","殿内不要拍照","保持安静"]},
    "西岸滨江步道":{story:"西岸滨江步道全长5公里，是上海最适合跑步和骑行的滨江路线之一。沿途设有专业塑胶跑道，江风拂面、绿树成荫。清晨可以看到太极晨练的老人，傍晚是情侣散步的浪漫时光，夜晚则是夜跑爱好者的天堂。",crowd:["跑步爱好者","骑行","江边散步"],bestTime:"早上6-8点 · 傍晚最佳",highlights:["5km专业跑道","骑行道","江景开阔","免费开放"],tips:["早上6点人最少","带水壶","有公共自行车租赁","夜跑注意安全"]},
    "西岸滨江草坪":{story:"西岸滨江的大草坪是上海市区内最大的一片滨江绿地，面积达数万平方米。这里可以看到黄浦江的壮阔景色，远处卢浦大桥的弧线若隐若现。冬天可以晒太阳，夏天可以吹江风，是上海人周末逃离城市压力的第一选择。",crowd:["野餐放松","亲子遛娃","放风筝"],bestTime:"下午3-6点 · 避开正午阳光",highlights:["超大面积","江景视野","放风筝","免费开放"],tips:["带野餐垫","防晒必备","有卫生间","周末人多建议早点占位"]},

    "猫咪咖啡馆":{story:"这家藏在龙华小巷深处的猫咪咖啡馆，养了5只性格各异的猫咪——有高冷布偶、粘人英短、还有一只三花大爷。老板是个爱猫的退休教师，她说：「每只猫都有治愈的力量，你只需要安静地坐在它们身边。」",crowd:["猫奴","疗愈放松","拍照打卡"],bestTime:"工作日下午 · 周末需等位",highlights:["5只猫咪","安静氛围","猫爪饮品","治愈空间"],tips:["周末人多建议工作日来","不要强行撸不熟的猫","点一杯猫爪拿铁超可爱","可以自带猫条"]},
    "江边长椅":{story:"西岸滨江沿线分布着许多木质长椅，其中有一张特别的长椅，椅背上刻着：「这座城市跑得太快了，坐下来休息一下吧。」这是西岸艺术季留下的公共艺术作品，如今成了无数人放空心事的地方。",crowd:["独处放空","听歌发呆","情绪疗愈"],bestTime:"傍晚5-7点 · 夕阳西下时分",highlights:["刻字长椅","江景","安静","免费"],tips:["带耳机听歌","带纸巾（可能想哭）","不要坐太久会冷","旁边有咖啡车"]},
    "老上海茶馆":{story:"这家茶馆藏在龙华老街的弄堂里，门面不大却别有洞天。老板是苏州评弹的老艺人，每天下午2点准时开场。一杯龙井配上吴侬软语的评弹，时光仿佛倒流回了上世纪三四十年代的老上海。",crowd:["传统文化爱好者","老人","茶客"],bestTime:"下午2点有评弹演出",highlights:["苏州评弹","老上海氛围","龙井茶","现场表演"],tips:["下午2点准时来占位","推荐碧螺春","不要大声喧哗","最低消费40元"]},
    "许愿墙":{story:"龙华寺外的许愿墙原本只是一面普通的墙，后来游客们自发地把写着心愿的纸条贴在上面，渐渐成了一道独特的风景。墙上密密麻麻的心愿，有人求学业、有人求姻缘、有人只写了「希望妈妈身体健康」。",crowd:["许愿祈福","情感寄托","拍照留念"],bestTime:"下午光线好拍照",highlights:["万人心愿","情感共鸣","免费","仪式感"],tips:["自己带笔和纸条","写完后拍照留念","不要撕别人的愿望","新年愿望墙最壮观"]},

    // ===== 散心系 =====
    "单向空间书店":{story:"单向空间是北京知名独立书店品牌在上海的分店，坐落在西岸艺术区。这里不仅卖书，还是文化沙龙的聚集地。一整面墙的书架从地面延伸到天花板，木质书桌上永远摆着几本「店员推荐」，是安静阅读的完美避风港。",crowd:["文艺青年","阅读爱好者","写作者"],bestTime:"工作日上午 · 周末下午有沙龙",highlights:["整墙书架","店员推荐","文化沙龙","咖啡阅读"],tips:["可以只看书不买","有咖啡区可以坐","周末留意沙龙活动","收银台旁边有文创"]},
    "独立咖啡馆":{story:"这家只有8个座位的小咖啡馆，是西岸咖啡圈里的隐藏高手。老板是前精品咖啡赛冠军，每杯手冲都像一场仪式——先闻香、再看豆、再注水，最后端上来的咖啡，味道层次分明得像一首诗。",crowd:["咖啡发烧友","独处","品鉴"],bestTime:"上午10-12点 · 新鲜烘焙时段",highlights:["冠军手冲","精品单品豆","极简装修","老板故事"],tips:["推荐埃塞俄比亚耶加雪菲","可以和老板聊咖啡","只有8个座位别怕","每周四上新豆子"]},
    "西岸梦工厂":{story:"西岸梦工厂的前身是上海水泥厂，建于1920年代，曾是远东最大的水泥生产基地。改造后保留了巨大的料斗和传送带，粗犷的工业遗迹与现代艺术展览形成奇妙碰撞。周五晚上的露天电影是最受欢迎的免费活动。",crowd:["工业遗迹爱好者","电影爱好者","拍照"],bestTime:"周五六晚上有活动",highlights:["水泥厂改造","露天电影","工业遗迹","免费开放"],tips:["周五晚露天电影免费","带毯子坐地上","小心旧建筑棱角","可以带外食"]},
    "江边步道":{story:"西岸的江边步道分为两层——上层是骑行道和跑步道，下层是亲水步道。傍晚时分走在下层步道上，黄浦江水近在咫尺，偶尔有驳船缓缓驶过，汽笛声在江面上回荡，城市的喧嚣仿佛被一层水雾隔绝在外。",crowd:["散步放空","情侣","摄影"],bestTime:"傍晚6-8点 · 日落蓝调时刻",highlights:["双层步道","亲水平台","驳船风景","蓝调时刻"],tips:["下层步道离水面更近","傍晚带外套","可以钓鱼（需证）","有公共厕所"]},
    "黄昏观景点":{story:"这个隐藏在西岸中段的观景点是摄影师们的秘密基地。它面向正西方向，每天傍晚太阳都会从对岸的建筑群中缓缓落下，把整个江面染成金红色。天气好的时候，甚至能看到太阳落到卢浦大桥的弧线下方。",crowd:["摄影爱好者","情侣约会","日落控"],bestTime:"17:30-18:00 · 冬天日落更早",highlights:["正西朝向","卢浦大桥","金色江面","蓝调时刻"],tips:["17:30前到位","带相机手机都行","带外套","不要站在护栏外"]},

    "废弃铁轨":{story:"这条铁轨是旧水泥厂的专用铁路，废弃后长满了野草和藤蔓。铁轨一直延伸到江边，尽头是一个半淹没在水中的旧码头。站在铁轨上向远处望去，工业遗迹与自然交融，是摄影爱好者心中的西岸最佳拍摄地。",crowd:["摄影爱好者","探险","工业遗迹"],bestTime:"下午光线好 · 注意安全",highlights:["旧铁轨","江边码头","野草藤蔓","工业风"],tips:["注意脚下铁轨湿滑","不要走到轨道中间","拍照注意来往人员","不要进入废弃建筑"]},
    "地下艺术空间":{story:"这个由防空洞改造的地下艺术空间，是西岸最酷的展览场地。混凝土拱顶、昏暗的灯光、回荡的脚步声，营造出的氛围比任何装修都更有戏剧性。这里只展出实验性和沉浸式的艺术作品，每次进去都像进入另一个世界。",crowd:["当代艺术","沉浸体验","探险"],bestTime:"下午 · 光线效果最好",highlights:["防空洞改造","沉浸式展览","混凝土美学","独特氛围"],tips:["穿舒适的鞋","温度偏低带外套","部分展览有年龄限制","提前查展览信息"]},
    "老弄堂":{story:"龙华寺背后还保留着几条原汁原味的老弄堂，石库门房子虽然斑驳却依然有人居住。穿过窄窄的弄堂，可以看到老阿姨在门口择菜、老伯伯在树下下棋、猫咪趴在窗台上晒太阳——这才是最真实的老上海生活。",crowd:["人文摄影","老上海文化","慢旅行"],bestTime:"早上8-10点 · 最有生活气息",highlights:["石库门","真实生活","老上海","人文摄影"],tips:["不要打扰居民生活","可以拍照但不要拍人特写","早上最有烟火气","弄堂路窄注意安全"]},
    "古井":{story:"这口明朝古井位于龙华寺后门的小巷深处，至今仍在使用。每天早上都能看到附近的老居民来这里打水洗菜。井口用青石砌成，边缘被几百年的绳索磨出了深深的沟痕。据说用这口井的水泡茶，味道格外清甜。",crowd:["历史爱好者","人文摄影","文化探访"],bestTime:"早上7-8点 · 看到居民打水",highlights:["明代遗存","仍在使用","绳索磨痕","活的历史"],tips:["早上来能看到居民打水","不要往井里扔东西","可以和老人聊天","旁边有石碑介绍历史"]},
    "秘密花园":{story:"这是一栋老旧居民楼的屋顶花园，由楼里的退休居民们自发打造。爬上6层楼梯推开门的一瞬间，满眼都是鲜花和绿植——月季、绣球、茉莉、薄荷，还有一架葡萄藤。从这里可以360度俯瞰龙华寺全景，是最高级的「隐藏观景点」。",crowd:["摄影爱好者","探索达人","植物爱好者"],bestTime:"上午光线好 · 花季4-10月",highlights:["屋顶花园","360度全景","居民自治","免费"],tips:["需要爬6层楼梯","跟居民说一声可以上去","不要摘花","上午光线最适合拍照"]},
    "艺术家工作室":{story:"西岸艺术区聚集了大量艺术家工作室，有些是对外开放的。你可以走进去看到艺术家们正在创作——画布上未完成的作品、工作台上散落的颜料、墙上贴满的草图。如果运气好，还能和艺术家聊聊创作背后的故事。",crowd:["艺术爱好者","收藏家","文化探访"],bestTime:"周末 · 艺术家通常在",highlights:["观看创作","交流互动","购买作品","工作室氛围"],tips:["不要预约直接去","尊重艺术家工作时间","作品可以谈价格","拍照前征得同意"]},
    "夜间集市":{story:"每周五六晚上7点开始的龙华夜间集市，是本地人才知道的秘密。这里没有游客景点的商业感，摊主都是附近的居民——阿姨卖自家腌的酱菜、大爷卖手工竹编、年轻人卖手作首饰。最有名的是一位老奶奶的馄饨摊，据说排队要等40分钟。",crowd:["本地体验","小吃爱好者","淘货"],bestTime:"周五六晚上7-10点",highlights:["本地人市集","手工馄饨","竹编工艺","真材实料"],tips:["老奶奶馄饨7点就去排","带现金部分摊位不支持手机","可以淘到有趣的小东西","9点后摊位开始收"]},
    "日出观景点":{story:"西岸最东端有一个开阔的观景平台，是观赏黄浦江日出的最佳位置。凌晨5点，当第一缕阳光穿过陆家嘴的建筑群照射在江面上，整个世界都是金色的。虽然需要早起，但这个画面会让你觉得一切都值得。",crowd:["摄影爱好者","早起星人","浪漫体验"],bestTime:"夏天5:00 · 冬天6:30 日出前30分钟到",highlights:["黄浦江日出","陆家嘴天际线","金色江面","宁静时刻"],tips:["提前查好日出时间","夏天5点冬天6:30","带三脚架","注意保暖带外套"]},

    // ===== 美食系 =====
    "龙华老街小吃街":{story:"龙华老街小吃街是上海最有烟火气的市集之一，每天从清晨6点开始营业。这里有经营了30年的生煎老店、排队1小时的葱油饼摊、还有只在早上出摊的馄饨挑子。每一口都是正宗的上海味道。",crowd:["美食爱好者","早餐控","老上海味道"],bestTime:"早上6-8点 · 最新鲜最热闹",highlights:["30年生煎店","葱油饼","小笼包","馄饨"],tips:["空腹来边走边吃","带现金","6点来最新鲜","生煎配醋绝了"]},
    "塔影咖啡":{story:"塔影咖啡的招牌是「塔影拿铁」——咖啡师会在拉花上画出龙华塔的轮廓。配合一快慕斯蛋糕，坐在窗边望着真实的龙华塔，喝着杯中的龙华塔，是一种有趣的「塔中塔」体验。",crowd:["咖啡爱好者","打卡拍照","约会"],bestTime:"上午 · 拉花最精致",highlights:["塔影拿铁","慕斯蛋糕","窗边看塔","网红打卡"],tips:["塔影拿铁是招牌","配慕斯蛋糕更搭","窗边位要早到","拍照先把拉花拍下来"]},
    "老字号面馆":{story:"这家面馆在龙华已经开了40年，从最初的路边摊发展到现在的小店面。老板每天凌晨4点就开始熬汤底，用的是猪骨和老母鸡慢炖6小时。一碗葱油拌面只要12元，是周边居民的最爱早餐。",crowd:["面食爱好者","早餐","本地人推荐"],bestTime:"早上6:30-8:00 · 面条最新鲜",highlights:["40年老店","6小时熬汤","葱油拌面12元","大排面"],tips:["6:30开门第一批最新鲜","葱油拌面必点","大排面也很推荐","中午会排队"]},
    "本帮菜馆":{story:"这家本帮菜馆的老板是上海本地人，做菜遵循「浓油赤酱」的传统。招牌红烧肉用的是五花三层的中方肉，小火慢炖3小时，入口即化。糖醋排骨外酥里嫩，连骨头都是甜的。",crowd:["本帮菜爱好者","家庭聚餐","上海味道"],bestTime:"中午11:30前 · 晚上需预订",highlights:["红烧肉","糖醋排骨","浓油赤酱","本地口味"],tips:["红烧肉必点","中午不用排队","建议4人以上点菜","有包厢需提前预订"]},
    "火锅店":{story:"这家老北京铜锅涮肉是龙华周边最受欢迎的火锅店。用的是传统铜锅炭火，涮的是手切鲜羊肉。最正宗的吃法是一碗麻酱蘸料配上糖蒜，冬天一群人围着热气腾腾的铜锅，是北方人最温暖的上海记忆。",crowd:["火锅爱好者","冬季聚餐","北方人"],bestTime:"晚上6-9点 · 冬天最应景",highlights:["铜锅炭火","手切鲜羊肉","麻酱蘸料","糖蒜"],tips:["冬天最火要等位","手切鲜羊肉比冻卷好","麻酱可以自己调","建议4人以上"]},
    "日式料理":{story:"这家日式料理的老板曾在东京筑地市场学习3年，对食材的讲究近乎偏执——三文鱼只选挪威空运的、大米用秋田产的越光米、芥末现磨不用管的。一口寿司入口，你会理解什么叫「食材本身的味道」。",crowd:["日料爱好者","约会","品质控"],bestTime:"晚上6-8点 · 午间有定食",highlights:["空运三文鱼","越光米","现磨芥末","Omakase"],tips:["午间定食性价比高","推荐Omakase套餐","提前一天预订包厢","有清酒推荐"]},
    "奶茶店":{story:"这家奶茶店虽然门面不大，但在龙华口碑极好。老板坚持用鲜奶和真茶底，拒绝植脂末和香精。招牌珍珠奶茶的珍珠每天现煮，Q弹得能在嘴里跳舞。排队虽然要等15分钟，但每一口都值得。",crowd:["奶茶控","年轻人","解渴"],bestTime:"下午 · 现煮珍珠最新鲜",highlights:["鲜奶真茶","现煮珍珠","拒绝植脂末","口碑好"],tips:["招牌珍珠奶茶必点","排队约15分钟","可以少糖/去冰","会员有积分"]},
    "西式烘焙":{story:"这家烘焙坊的面包师傅是法国人，每天凌晨3点开始揉面发酵。可颂酥皮层层分明、法棍外脆内软、还有每周限定一次的国王饼。推开店门的瞬间，黄油和面粉的香气扑面而来，是龙华最幸福的早晨味道。",crowd:["面包爱好者","早餐","法式甜点"],bestTime:"早上7-8点 · 刚出炉最新鲜",highlights:["法式可颂","国王饼限定","法国面包师","每日新鲜"],tips:["7点来最新鲜","国王饼只有周一次","法棍可以要求切半","有堂食座位"]},

    // ===== 祈福系 =====
    "许愿树":{story:"龙华寺内的许愿树是一棵已有200年树龄的古银杏。游客们将写有心愿的红丝带系在树枝上，远远望去满树红丝带随风飘扬，场面壮观。据说在树前投一枚硬币许愿，愿望更容易实现。",crowd:["祈福许愿","仪式感","拍照"],bestTime:"全年 · 新年前后最壮观",highlights:["200年古银杏","红丝带","投币许愿","满树心愿"],tips:["自带红丝带和笔","投1角硬币入树根","新年许愿最灵","不要拉扯树枝"]},
    "财神殿":{story:"财神殿位于龙华寺的东侧，供奉着文财神比干和武财神赵公明。每逢正月初五「迎财神」的日子，这里会排起几百米的长队，鞭炮声震耳欲聋。据说在这里拜过的做生意的人，当年生意都会格外红火。",crowd:["求财运","做生意","正月初五"],bestTime:"正月初五迎财神 · 初一十五",highlights:["文武财神","迎财神","香火旺盛","求财圣地"],tips:["正月初五最灵验","带香来","可以请一个财神符","心诚则灵"]},
    "姻缘殿":{story:"姻缘殿供奉着月老，是龙华寺最「甜蜜」的殿堂。殿内挂满了红色同心结，每对来祈福的情侣都会在这里系上一个。据说在月老面前说出心上人的名字，如果一阵风吹来，就说明姻缘将近。",crowd:["求姻缘","情侣祈福","单身"],bestTime:"情人节前后 · 七夕最灵",highlights:["月老","红色同心结","姻缘红线","情侣祈福"],tips:["单身来求姻缘最灵","情侣一起祈福","系同心结5元一个","七夕排队人很多"]},
    "平安符售卖处":{story:"龙华寺的平安符由寺内僧人亲手制作并开光，分为平安符、学业符、健康符等多种。每个符袋上都绣着精美的佛像和经文，装在红色的锦囊里。许多家长在考试季都会来为孩子请一个学业符。",crowd:["求平安","送祝福","考试季"],bestTime:"全年 · 考试季和新年最旺",highlights:["僧人手工制作","开光加持","多种符类","红色锦囊"],tips:["30-100元价格不等","学业符考试季最火","可以请多个送人","开光后不要沾水"]},

    // ===== 运动系 =====
    "龙华寺广场":{story:"每天早上7点，龙华寺广场就会准时出现一群白发苍苍的太极拳爱好者。他们中最大的已经88岁，动作却比年轻人还标准。跟随他们练上一套八段锦，呼吸着清晨微凉的空气，是开始一天最健康的方式。",crowd:["晨练爱好者","太极","中老年"],bestTime:"每天早上7-8点",highlights:["太极拳","八段锦","免费参与","社区氛围"],tips:["7点准时开始","穿宽松运动服","可以跟在后面学","结束后可以逛龙华寺"]},
    "自行车租赁点":{story:"西岸设有多个公共自行车租赁点，扫码即骑。从龙华寺出发，沿着滨江骑行到徐汇滨江公园，全程约10公里，沿途经过美术馆、艺术中心和江景步道。骑行过程中可以随时停下来拍照或休息，是最自由的城市探索方式。",crowd:["骑行爱好者","情侣","家庭出游"],bestTime:"上午9-11点 · 傍晚4-6点",highlights:["10公里滨江路线","扫码即骑","沿途艺术馆","自由灵活"],tips:["下载App扫码租车","前30分钟免费","带水壶","沿途有多处停放点"]},
    "健身房":{story:"这家24小时营业的健身房就在西岸步行5分钟的距离，器械区有氧区齐全。最特别的是它的落地窗直面黄浦江，跑步的时候看着江面和远处的天际线，让枯燥的有氧运动也变成了一种享受。",crowd:["健身爱好者","出差人士","自律青年"],bestTime:"晚上8-10点 · 人最少",highlights:["24小时营业","江景落地窗","器械齐全","淋浴设施"],tips:["单次50元","有月卡优惠","晚上8点后人少","自带毛巾和水"]},
    "攀岩馆":{story:"这家室内攀岩馆有20多条不同难度的线路，从入门的V0到挑战极限的V8都有。最受欢迎的是一面15米高的模拟岩壁，上面还原了真实户外攀岩的手点和脚点。教练都是国家级运动员退役，安全又专业。",crowd:["攀岩爱好者","团建","挑战自我"],bestTime:"工作日下午 · 周末需预约",highlights:["20+线路","15米高墙","专业教练","安全设施"],tips:["新手有教练带","穿运动鞋去","提前预约周末时段","恐高慎选高墙"]},
    "瑜伽馆":{story:"这家瑜伽馆的教室有一整面落地窗对着黄浦江，做瑜伽的时候可以看着江面和天空。主修的是流瑜伽和阿斯汤加，每节课90分钟。清晨的日出瑜伽课是最受欢迎的——在朝阳中做第一个拜日式，感觉整个人都被净化了。",crowd:["瑜伽爱好者","减压放松","女性"],bestTime:"早上7点日出课 · 晚上8点冥想课",highlights:["江景教室","流瑜伽","日出课程","冥想课"],tips:["自带瑜伽垫有优惠","早上日出课需提前预约","第一次来提前15分钟","有淋浴更衣"]},
    "篮球场":{story:"西岸滨江有一个免费的户外篮球场，地面是标准塑胶材质，配有照明灯。每天下午5点以后，附近的篮球爱好者就会自发组队打3v3半场赛。气氛热烈但友好，水平参差但热情不减。",crowd:["篮球爱好者","运动社交","年轻人"],bestTime:"下午5-8点 · 夏天最热闹",highlights:["免费","塑胶地面","夜间照明","3v3半场"],tips:["自带篮球","下午5点后人最多","可以临时组队","有饮水处"]},

    // ===== 躺平系 =====
    "龙华寺广场":{story:"龙华寺广场在午后人少的时候特别安静。找个台阶坐下，听寺里的钟声悠远地传来，看鸽子在广场上踱步，什么都不做也不想，就是发呆。老和尚说过：「不是在修行，就是在发呆，这两者没什么区别。」",crowd:["发呆放空","冥想","精神充电"],bestTime:"下午3-4点 · 人最少最安静",highlights:["钟声悠远","鸽子踱步","台阶发呆","免费"],tips:["下午3点后人最少","带个坐垫更舒服","不要大声说话","发呆不是浪费时间"]},
    "江边长椅":{story:"西岸滨江最不缺的就是长椅，每一张的位置和角度都不同，看到的风景也不同。有一张长椅正对着江面最宽处，坐上去可以看到整条黄浦江。什么都不用想，就看水、看船、看天，让大脑彻底放空。",crowd:["独处放空","听歌发呆","情绪疗愈"],bestTime:"傍晚5-7点 · 夕阳西下时分",highlights:["刻字长椅","江景","安静","免费"],tips:["带耳机听歌","带纸巾（可能想哭）","不要坐太久会冷","旁边有咖啡车"]},

function openPoiDetail(poi,idx){
    const detail=POI_DETAILS[poi.name]||{};
    const story=detail.story||`${poi.name}位于龙华核心区域，是龙华·灵境向导精心推荐的必去之地。这里的独特氛围让你感受到不一样的龙华魅力。`;
    const crowd=(detail.crowd||["所有人群"]).map(c=>`<span class="sheet-tag">${c}</span>`).join('');
    const highlights=(detail.highlights||[poi.hook]).map(h=>`<span class="sheet-tag highlight">${h}</span>`).join('');
    const tips=(detail.tips||[poi.tip]).map(t=>`<li style="margin-bottom:4px">${t}</li>`).join('');
    const bestTime=detail.bestTime||'随时可去';
    const costText=poi.cost===0?'免费':`约${poi.cost}元`;
    const modal=document.getElementById('poiModal');
    modal.innerHTML=`
    <div class="modal-overlay" onclick="if(event.target===this)closePoiDetail()">
        <div class="modal-sheet">
            <div class="sheet-header" style="position:relative">
                <div class="sheet-handle"></div>
                <button class="close-btn" onclick="closePoiDetail()">✕</button>
                <h2>${idx+1}. ${poi.name}</h2>
                <div class="sheet-rating">${poi.score} · ${bestTime}</div>
            </div>
            <div class="sheet-body">
                <div class="sheet-section">
                    <div class="section-label">💡 推荐理由</div>
                    <div class="section-content">${poi.why}</div>
                </div>
                <div class="sheet-info-grid">
                    <div class="sheet-info-item">
                        <div class="info-icon">⏱️</div>
                        <div class="info-value">${poi.time}分钟</div>
                        <div class="info-label">建议停留</div>
                    </div>
                    <div class="sheet-info-item">
                        <div class="info-icon">💰</div>
                        <div class="info-value">${costText}</div>
                        <div class="info-label">预计花费</div>
                    </div>
                </div>
                <div class="sheet-section">
                    <div class="section-label">📖 故事背景</div>
                    <div class="sheet-story">${story}</div>
                </div>
                <div class="sheet-section">
                    <div class="section-label">✨ 亮点标签</div>
                    <div class="sheet-tags">${highlights}</div>
                </div>
                <div class="sheet-section">
                    <div class="section-label">👥 适合人群</div>
                    <div class="sheet-tags">${crowd}</div>
                </div>
                <div class="sheet-section">
                    <div class="section-label">🎫 优惠</div>
                    <div class="section-content" style="color:#E87A5D;font-weight:500">${poi.hook}</div>
                </div>
                <div class="sheet-section">
                    <div class="section-label">📌 实用贴士</div>
                    <ul style="padding-left:18px;font-size:0.85rem;color:#6b5a4e;line-height:1.7">${tips}</ul>
                </div>
                <div class="sheet-actions">
                    <button class="nav-btn-action" onclick="navigateTo(${poi.lat},${poi.lng},'${poi.name}')">🗺️ 导航前往</button>
                    <button class="voice-btn-action" onclick="playNaturalTTS('${poi.why}')">🔊 语音播报</button>
                </div>
            </div>
        </div>
    </div>`;
    document.body.style.overflow='hidden';
}

function closePoiDetail(){
    document.getElementById('poiModal').innerHTML='';
    document.body.style.overflow='';
}

function navigateTo(lat,lng,name){
    if(window.AMap){
        window.open(`https://uri.amap.com/navigation?to=${lng},${lat},${name}&mode=bus&callnative=0`,'_blank');
    }else{
        showToast('地图加载中，请稍后再试');
    }
}

function showToast(msg){
    const t=document.getElementById('toast');t.textContent=msg;t.style.display='block';setTimeout(()=>t.style.display='none',2500)
}

// 偏好设置保存与加载
function savePreference(key, value) {
    const prefs = JSON.parse(localStorage.getItem('pathjoy_preferences') || '{}');
    prefs[key] = value;
    localStorage.setItem('pathjoy_preferences', JSON.stringify(prefs));
    console.log('✅ 偏好已保存', key, value);
}

function loadPreferences() {
    const prefs = JSON.parse(localStorage.getItem('pathjoy_preferences') || '{}');
    if (prefs.emotion) {
        const emotionBtn = document.querySelector(`.emotion-btn[data-emotion="${prefs.emotion}"]`);
        if (emotionBtn) {
            document.querySelectorAll('.emotion-btn').forEach(b => b.classList.remove('active'));
            emotionBtn.classList.add('active');
            console.log('✅ 已加载情绪偏好', prefs.emotion);
        }
    }
    if (prefs.type) {
        const typeBtn = document.querySelector(`.type-btn[data-type="${prefs.type}"]`);
        if (typeBtn) {
            document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
            typeBtn.classList.add('active');
            selectedType = prefs.type;
            document.getElementById('selectedTypeDisplay').textContent = TYPE_CONFIG[prefs.type].name;
            console.log('✅ 已加载类型偏好', prefs.type);
        }
    }
}

function getPreference(key, defaultValue) {
    const prefs = JSON.parse(localStorage.getItem('pathjoy_preferences') || '{}');
    return prefs[key] || defaultValue;
}

function clearPreferences() {
    localStorage.removeItem('pathjoy_preferences');
    showToast('🔄 偏好设置已重置');
    location.reload();
}

function bindEvents(){
    document.querySelectorAll('.emotion-btn').forEach(btn=>btn.addEventListener('click',function(){
        document.querySelectorAll('.emotion-btn').forEach(b=>b.classList.remove('active'));
        this.classList.add('active');
        const emotion=this.dataset.emotion;
        showToast(`已选择：${this.querySelector('.label').textContent}`);
        savePreference('emotion',emotion)
    }));
    document.getElementById('generateBtn').addEventListener('click',generateRoute);
    document.querySelector('.emotion-btn')?.classList.add('active');
    document.querySelectorAll('.type-btn').forEach(btn=>btn.addEventListener('click',function(){
        document.querySelectorAll('.type-btn').forEach(b=>b.classList.remove('active'));
        this.classList.add('active');
        selectedType=this.dataset.type;
        const typeName=TYPE_CONFIG[selectedType].name;
        showToast(`已切换：${typeName}`);
        document.getElementById('selectedTypeDisplay').textContent=typeName;
        savePreference('type',selectedType)
    }));
    document.getElementById('customQuery').addEventListener('keypress',e=>{if(e.key==='Enter')generateRoute()});
    loadPreferences()
}
bindEvents();
window.addEventListener('load',()=>setTimeout(()=>showToast("🐉 欢迎来到龙华·灵境向导！"),500));
</script>
