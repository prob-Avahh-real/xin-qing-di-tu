<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>龙华·灵境向导 - 朋友圈分享图生成器</title>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:-apple-system,sans-serif;background:#f5f5f5;padding:20px}
        .container{max-width:600px;margin:0 auto}
        .share-card{width:375px;height:667px;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);border-radius:20px;overflow:hidden;position:relative;box-shadow:0 10px 30px rgba(0,0,0,0.2)}
        .card-header{padding:40px 24px 24px;background:rgba(255,255,255,0.1)}
        .card-title{color:#fff;font-size:24px;font-weight:600;margin-bottom:8px}
        .card-subtitle{color:rgba(255,255,255,0.8);font-size:14px}
        .card-route{background:#fff;margin:16px 24px;padding:20px;border-radius:16px}
        .route-name{font-size:18px;font-weight:600;color:#1f2937;margin-bottom:12px}
        .route-stats{display:flex;gap:12px;margin-bottom:16px}
        .stat{flex:1;text-align:center;padding:8px;background:#f9fafb;border-radius:8px}
        .stat-value{font-size:16px;font-weight:600;color:#667eea}
        .stat-label{font-size:10px;color:#9ca3af;margin-top:4px}
        .route-points{list-style:none}
        .point-item{padding:10px;border-left:3px solid #667eea;margin-bottom:8px;background:#f9fafb;border-radius:0 6px 6px 0}
        .point-name{font-size:13px;font-weight:500;color:#1f2937}
        .point-desc{font-size:11px;color:#9ca3af;margin-top:4px}
        .card-footer{padding:24px;text-align:center;color:#fff}
        .qr-placeholder{width:120px;height:120px;background:#fff;margin:0 auto 12px;border-radius:12px;display:flex;align-items:center;justify-content:center}
        .qr-text{font-size:12px;color:#667eea}
        .card-slogan{font-size:14px;opacity:0.9}
        .controls{margin-top:30px;background:#fff;padding:20px;border-radius:12px}
        .input-group{margin-bottom:16px}
        .input-group label{display:block;font-size:14px;font-weight:500;margin-bottom:8px;color:#374151}
        .input-group input,.input-group select{width:100%;padding:10px;border:2px solid #e5e7eb;border-radius:8px;font-size:14px}
        .btn{width:100%;padding:14px;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;margin-bottom:8px}
        .btn-secondary{background:#f3f4f6;color:#374151}
        .preview-title{font-size:18px;font-weight:600;margin-bottom:16px;color:#1f2937}
        .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.8);color:#fff;padding:12px 24px;border-radius:8px;font-size:14px;display:none;z-index:1000}
        .emotion-tag{display:inline-block;padding:4px 12px;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border-radius:20px;font-size:12px;margin-bottom:12px}
    </style>
</head>
<body>
    <div class="container">
        <h2 class="preview-title">📤 朋友圈分享图生成器</h2>
        
        <!-- 设置区域 -->
        <div class="controls">
            <div class="input-group">
                <label>路线名称</label>
                <input type="text" id="routeName" value="治愈放松之旅" oninput="updatePreview()">
            </div>
            <div class="input-group">
                <label>情绪类型</label>
                <select id="emotionType" onchange="updatePreview()">
                    <option value="relax">😌 放松</option>
                    <option value="heal">😢 疗愈</option>
                    <option value="photo">📸 拍照</option>
                    <option value="social">👫 社交</option>
                </select>
            </div>
            <div class="input-group">
                <label>体验分</label>
                <input type="number" id="scoreValue" value="8.5" step="0.1" max="10" oninput="updatePreview()">
            </div>
            <div class="input-group">
                <label>出片点数量</label>
                <input type="number" id="photoValue" value="5" oninput="updatePreview()">
            </div>
            <div class="input-group">
                <label>预估省¥</label>
                <input type="number" id="saveValue" value="50" oninput="updatePreview()">
            </div>
            <button class="btn" onclick="downloadShare()">📸 下载分享图</button>
            <button class="btn btn-secondary" onclick="copyInstructions()">📋 复制发圈指南</button>
        </div>

        <!-- 预览区域 -->
        <h3 class="preview-title" style="margin-top:30px">预览效果：</h3>
        <div class="share-card" id="shareCard">
            <div class="card-header">
                <div class="emotion-tag" id="previewEmotion">😌 放松</div>
                <div class="card-title">龙华·灵境向导</div>
                <div class="card-subtitle">情绪出行规划师</div>
            </div>
            <div class="card-route">
                <div class="route-name" id="previewRouteName">治愈放松之旅</div>
                <div class="route-stats">
                    <div class="stat">
                        <div class="stat-value" id="previewScore">8.5</div>
                        <div class="stat-label">体验分</div>
                    </div>
                    <div class="stat">
                        <div class="stat-value" id="previewPhoto">5</div>
                        <div class="stat-label">出片点</div>
                    </div>
                    <div class="stat">
                        <div class="stat-value" id="previewSave">50</div>
                        <div class="stat-label">预估省¥</div>
                    </div>
                </div>
                <ul class="route-points" id="previewPoints">
                    <li class="point-item">
                        <div class="point-name">1. 龙华寺</div>
                        <div class="point-desc">千年古刹，静心祈福</div>
                    </li>
                    <li class="point-item">
                        <div class="point-name">2. 塔影空间</div>
                        <div class="point-desc">网红打卡，文艺咖啡</div>
                    </li>
                    <li class="point-item">
                        <div class="point-name">3. 西岸滨江</div>
                        <div class="point-desc">江风拂面，日落晚霞</div>
                    </li>
                </ul>
            </div>
            <div class="card-footer">
                <div class="qr-placeholder">
                    <div class="qr-text">扫码体验</div>
                </div>
                <div class="card-slogan">🐉 懂你心情的龙华出行搭子</div>
            </div>
        </div>

        <div class="toast" id="toast"></div>
    </div>

    <script>
        const routes = {
            relax: { name: '治愈放松之旅', emotion: '😌 放松', points: ['龙华寺 - 千年古刹，静心祈福', '塔影空间 - 网红打卡，文艺咖啡', '西岸滨江 - 江风拂面，日落晚霞'] },
            heal: { name: '心灵疗愈之路', emotion: '😢 疗愈', points: ['龙华烈士陵园 - 缅怀先烈，铭记历史', '龙华寺 - 听钟声，品素面', '西岸美术馆 - 艺术治愈心灵'] },
            photo: { name: '网红打卡专线', emotion: '📸 拍照', points: ['塔影空间 - 最佳机位：3 楼露台', '龙美术馆 - 工业风拍照圣地', '西岸大剧院 - 现代建筑美学'] },
            social: { name: '社交聚会路线', emotion: '👫 社交', points: ['龙华老街 - 小吃聚集地', '塔影空间 - 下午茶聊天', '西岸营地 - 户外活动社交'] }
        };

        function updatePreview() {
            const emotion = document.getElementById('emotionType').value;
            const route = routes[emotion];
            document.getElementById('previewEmotion').textContent = route.emotion;
            document.getElementById('previewRouteName').textContent = document.getElementById('routeName').value;
            document.getElementById('previewScore').textContent = document.getElementById('scoreValue').value;
            document.getElementById('previewPhoto').textContent = document.getElementById('photoValue').value;
            document.getElementById('previewSave').textContent = document.getElementById('saveValue').value;
            document.getElementById('previewPoints').innerHTML = route.points.map((p, i) => 
                `<li class="point-item">
                    <div class="point-name">${i + 1}. ${p.split(' - ')[0]}</div>
                    <div class="point-desc">${p.split(' - ')[1]}</div>
                </li>`
            ).join('');
        }

        function downloadShare() {
            const card = document.getElementById('shareCard');
            html2canvas(card, { scale: 2, useCORS: true }).then(canvas => {
                const link = document.createElement('a');
                link.download = `龙华灵境向导-${Date.now()}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
                showToast('✅ 分享图已下载！打开微信→朋友圈→粘贴图片');
            });
        }

        function copyInstructions() {
            const text = `📤 朋友圈分享指南

1. 点击上方"下载分享图"
2. 保存生成的图片到手机
3. 打开微信 → 发现 → 朋友圈
4. 点击右上角相机图标
5. 选择"从相册选择"
6. 选中刚才下载的图片
7. 输入文案（可选）：
   "我在龙华·灵境向导发现了一条超棒的路线！"
8. 点击"发表"

完成！🎉`;
            navigator.clipboard.writeText(text);
            showToast('📋 发圈指南已复制！');
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.style.display = 'block';
            setTimeout(() => toast.style.display = 'none', 3000);
        }

        // 初始化
        updatePreview();
    </script>
</body>
</html>
